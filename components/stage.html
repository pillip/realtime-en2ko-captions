<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ROOM_NAME}} — 무대 화면</title>
  <style>
    /* 무대 합성 화면 (ISSUE-40). viewer.html 의 minimal-dark 톤을 계승한다.
       레이아웃: 2열 Grid(발표 영역 / 자막 컬럼) × 좌열 3행(헤더 / 스테이지 /
       로고 바). 16:9 소스가 세로로 긴 좌열에 들어갈 때 남는 세로 공간을
       헤더 바와 로고 바가 흡수한다 — 두 바가 존재하는 이유가 그것이다. */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      /* 서버가 stage_config.caption_ratio 로부터 계산한 폭을 부트스트랩에서
         덮어쓴다. 여기 기본값은 JS 가 죽어도 Grid 가 무너지지 않게 하는
         안전망이다. 폭 문자열을 그대로 쓰지 않는 이유: 템플릿이 두 비율의
         값을 모두 갖고 있으면 응답 본문으로 룸 설정을 구분할 수 없다. */
      --caption-width: calc(100% / 4);
      --canvas: #0b0b0c;
      --hairline: rgba(255, 255, 255, 0.07);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--canvas);
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      word-break: keep-all;
      line-height: 1.5;
    }

    /* --- 2열 Grid ------------------------------------------------------- */
    .stage {
      display: grid;
      grid-template-columns: 1fr var(--caption-width);
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }

    /* --- 좌열 3행 (헤더 / 발표 영역 / 로고 바) --------------------------- */
    .stage-main {
      display: grid;
      /* 열 트랙을 반드시 명시한다. 생략하면 암시적 트랙이 `auto`
         (= minmax(auto, max-content)) 라서 긴 행사 타이틀이나 룸 이름의
         max-content 폭만큼 트랙이 자라고, 헤더와 16:9 프레임이 자막 컬럼
         위에 그려진다. 컨테이너의 min-width: 0 은 컨테이너 박스만 제약할
         뿐 트랙을 잡지 못한다 (RL-017). */
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
    }

    .event-header {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      /* 타이틀이 비어 룸 이름으로 대체돼도 높이가 유지되어 좌열 레이아웃이
         흔들리지 않는다. RL-012: 세로 여백은 margin 이 아니라 padding. */
      min-height: 88px;
      padding: 18px 44px;
      border-bottom: 1px solid var(--hairline);
    }
    .event-title {
      margin: 0;
      font-size: clamp(20px, 1.9vw, 44px);
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-subtitle {
      margin: 0;
      font-size: clamp(13px, 1vw, 22px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-subtitle[hidden] { display: none; }

    /* --- 발표 영역: 어떤 뷰포트에서도 16:9 를 유지한다 ------------------- */
    .presentation {
      display: grid;
      place-items: center;
      /* Grid 자식이 콘텐츠 최소 크기 때문에 넘치지 않게 (필수). */
      min-height: 0;
      min-width: 0;
      padding: 0;
      background: #000000;
      container-type: size;
    }
    .stage-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      /* 컨테이너 높이가 제약일 때 폭을 줄여 비율을 지킨다. cqh 미지원
         브라우저는 위의 width: 100% + max-height 로 degrade 한다
         (RL-011 의 vh/dvh 페어링과 같은 점진적 향상 패턴). */
      width: min(100%, calc(100cqh * 16 / 9));
      overflow: hidden;
      background: #000000;
    }

    /* 캡처 스트림은 ISSUE-42 가 연결한다. 16:9 가 아닌 소스도 잘리거나
       늘어나지 않도록 contain 으로 레터박스 처리한다. */
    .capture-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
    }
    .capture-video[hidden] { display: none; }

    .title-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 4% 6%;
      text-align: center;
    }
    .title-card[hidden] { display: none; }
    .title-card-title {
      font-size: clamp(24px, 3.2vw, 68px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .title-card-subtitle {
      font-size: clamp(14px, 1.4vw, 30px);
      color: rgba(255, 255, 255, 0.55);
    }
    .title-card-subtitle[hidden] { display: none; }
    .title-card-logos {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding-top: 12px;
    }
    .title-card-logos img {
      max-height: 7vh;
      max-width: 18vw;
      object-fit: contain;
    }

    /* --- 로고 바: 자산 없는 그룹은 숨기고, 전 그룹이 비면 바가 접힌다 ---- */
    .logo-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 48px;
      min-height: 76px;
      padding: 14px 44px;
      border-top: 1px solid var(--hairline);
    }
    /* UA 의 [hidden] 규칙은 위 display:flex 에 밀리므로 명시적으로 잡는다. */
    .logo-bar[hidden] { display: none; }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-group-label {
      font-size: clamp(11px, 0.75vw, 16px);
      letter-spacing: 0.1em;
      /* 0.4 은 3.80:1 로 WCAG AA(4.5:1) 미달이었다. #0b0b0c 위에서 흰색이
         4.5:1 을 넘기는 알파 하한은 0.45, 0.5 는 5.34:1 (RL-018). */
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }
    .logo-group img {
      display: block;
      max-height: 46px;
      max-width: 200px;
      object-fit: contain;
    }

    /* --- 우열: 자막 컬럼 -------------------------------------------------- */
    .caption-column {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-left: 1px solid var(--hairline);
      background: var(--canvas);
      /* 연결 배너(.conn-error)의 컨테이닝 블록. 배너를 뷰포트에 앵커하면
         발표 영역 위로 떠오른다 — 컬럼 안에 가둔다. */
      position: relative;
    }
    .caption-live {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
    }
    .caption-live[hidden] { display: none; }
    .caption-scroll {
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .caption-scroll::-webkit-scrollbar { display: none; }
    .caption-container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 20px;
      padding: 36px 28px 44px;
    }
    /* 좁은 컬럼 타이포 (ux_spec § Stage Composite View). */
    .caption-line {
      font-size: clamp(20px, 1.4vw + 8px, 32px);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.01em;
      /* clamp 하한이 20px 이라 뷰포트가 좁으면 large-text 완화(3:1)를 쓸 수
         없다. 0.42 는 4.04:1 로 미달, 0.45 가 4.52:1 로 AA 하한이다
         (RL-018). 현재 줄의 순백과의 대비는 그대로 유지된다. */
      color: rgba(255, 255, 255, 0.45);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .caption-container .caption-line:last-child { color: #ffffff; }
    .caption-empty {
      font-size: clamp(14px, 1vw, 19px);
      /* 0.32 는 2.81:1 로 WCAG AA 미달이었다 — 행사장 뒤쪽에서 읽어야 하는
         유일한 문구다. 0.5 → 5.34:1 (RL-018). */
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      padding: 24px 0;
      letter-spacing: 0.01em;
    }
    .caption-ended {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: clamp(16px, 1.2vw, 24px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
    }
    .caption-ended[hidden] { display: none; }

    /* 스크린리더 전용 라이브 리전 (#caption-announcer). 흔히 복사되는 구식
       clip 패턴은 음수 세로 margin 을 쓰는데, 이 페이지는 세로 margin 을 아예
       금지한다 (RL-012). 잘라내는 일은 clip-path 가 하므로 margin 은 0 이다. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* 연결 힌트 — viewer.html:250 의 pill 을 자막 컬럼 하단에 앵커한 것.
       텍스트 대비는 캔버스가 아니라 **pill 합성색** 위에서 계산해야 한다
       (RL-018): rgba(255,255,255,0.07) on #0b0b0c = rgb(28,28,29), 그 위의
       rgba(255,255,255,0.65) 는 7.81:1 (테스트의 정수 반올림 계산으로는
       7.85:1). pill 위에서 AA 4.5:1 을 넘기는 알파 하한은 0.46 이다 (0.45 는
       4.44:1 로 미달) — 캔버스 위 하한 0.45 보다 높으니 눈대중으로 낮추지 말 것. */
    .conn-error {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.65);
      font-size: clamp(12px, 0.7vw, 16px);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }
    .conn-error.visible { display: block; }
  </style>
  <script>
    // -----------------------------------------------------------------------
    // Bootstrap config — 서버가 템플릿 치환으로 주입한다.
    // 이 블록 안의 모든 값은 스칼라까지 포함해 _json_for_script 가 만든
    // **완성된 JS 리터럴** 이다 — 따옴표도 서버가 붙인다. 템플릿에서 따옴표를
    // 감싸고 html.escape 를 쓰면 `\` 가 닫는 따옴표를 탈출시켜 부트스트랩이
    // 통째로 죽고, 따옴표는 HTML 엔티티로 바뀌어 값 자체가 손상된다
    // (스크립트 블록 안에서는 엔티티가 디코딩되지 않는다 — RL-016/020).
    // <head> 에 두는 이유: 자막 컬럼 폭을 첫 페인트 전에 확정하기 위함.
    // -----------------------------------------------------------------------
    const CONFIG = {
      room_id: {{ROOM_ID}},
      output_langs: {{OUTPUT_LANGS_JSON}},
      caption_lang: {{PRIMARY_LANG}},
      initial_state: {{INITIAL_STATE}}, // 'waiting' | 'active' | 'closed'
      stage: {{STAGE_CONFIG_JSON}},
    };

    if (CONFIG.stage && CONFIG.stage.caption_width) {
      const root = document.documentElement.style;
      root.setProperty("--caption-width", CONFIG.stage.caption_width);
    }

    // 없는 에셋은 해당 이미지만 제거해 로고 바 레이아웃을 지킨다 (RL-008).
    // 다만 그룹의 마지막 이미지가 죽으면 라벨만 떠 있는 빈 그룹이 되고,
    // 그런 그룹만 남으면 76px 바가 글자만으로 채워진다 — 스크린리더에도
    // "주최" 만 읽히고 아무것도 없는 상태다. 그래서 비어버린 그룹과, 그룹이
    // 하나도 남지 않은 바까지 함께 접는다.
    // /branding 라우트는 ISSUE-38 이 제공한다 — 아직 없으면 전부 404 다.
    function dropBrokenLogo(img) {
      const group = img.closest(".logo-group");
      img.remove();
      if (group && !group.querySelector("img")) group.remove();
      const bar = document.getElementById("logo-bar");
      if (bar && !bar.querySelector(".logo-group")) bar.hidden = true;
    }

    function makeLogoImage(filename, alt) {
      const img = document.createElement("img");
      img.alt = alt; // RL-010: 그룹 라벨에서 파생, 반복 표시는 alt=""
      img.decoding = "async";
      img.addEventListener("error", function () { dropBrokenLogo(img); });
      // URL 컨텍스트 — 파일명은 stage_config 가 검증하지 않고 넘긴 값이므로
      // 반드시 퍼센트 인코딩한 뒤 src *프로퍼티* 로 넣는다 (마크업 조립 금지).
      img.src = "/branding/" + encodeURIComponent(CONFIG.room_id) +
                "/" + encodeURIComponent(filename);
      return img;
    }

    // -----------------------------------------------------------------------
    // 자막 컬럼 (ISSUE-41) — viewer.html 의 SSE 구독 + 타자기 스무딩을 무대용
    // 으로 이식한다. viewer 와 다른 점 두 가지:
    //  (1) 타이머가 28ms 인터벌이 아니라 requestAnimationFrame 이다. 무대
    //      페이지는 캡처 <video>(ISSUE-42)의 프레임 렌더와 메인 스레드를
    //      공유하므로, 렌더 스케줄과 무관하게 깨어나는 타이머를 쓰면 영상이
    //      버벅인다 (NFR-025).
    //  (2) 이 화면에는 조작자가 없으므로 사용자 스크롤 감지 분기가 없다 —
    //      항상 하단 고정이고 되돌리기 어포던스도 두지 않는다.
    // -----------------------------------------------------------------------
    const MAX_LINES = 60; // 좁은 컬럼 DOM 상한 (viewer 는 200)
    const MAX_REVEAL_PER_FRAME = 24; // 큰 청크가 한 프레임을 통째로 잡지 않도록
    const WAITING_MSG = {
      ko: "잠시 후 시작됩니다",
      en: "Starting shortly",
      zh: "即将开始",
      vi: "Sắp bắt đầu",
    };

    // DOM 참조는 DOMContentLoaded 에서 채운다 — 이 블록은 <head> 에서 돈다.
    let captionLive = null;
    let captionEnded = null;
    let scroller = null;
    let container = null;
    let announcer = null;
    let connError = null;

    let es = null;
    let captionState = "waiting"; // 'waiting' | 'active' | 'ended'
    let currentLine = null; // 진행 중인 .caption-line (라인 사이에는 null)
    let twTarget = ""; // 드러내야 할 최종 텍스트
    let twShown = 0; // 지금까지 화면에 나온 글자 수
    let twFinalize = false; // 따라잡으면 라인을 확정할 것인가
    let twRaf = 0; // rAF 핸들 (0 = 정지)

    // 항상 하단 고정. 다만 매 프레임 scrollTop 을 쓰면 강제 레이아웃이 생기므로
    // 값이 실제로 달라질 때만 쓴다.
    function _scrollToBottom() {
      if (!scroller) return;
      const max = scroller.scrollHeight - scroller.clientHeight;
      if (max > 0 && scroller.scrollTop !== max) scroller.scrollTop = max;
    }

    function _twStop() {
      if (twRaf) {
        cancelAnimationFrame(twRaf);
        twRaf = 0;
      }
    }

    // 라이브 리전에 쓰는 **유일한** 경로 (RL-019). 애니메이션 노드는
    // aria-hidden 이므로, 확정된 라인만 여기로 흘려보내야 스크린리더가
    // 프레임마다 텍스트로 범람하지 않는다.
    function announce(text) {
      if (announcer) announcer.textContent = text;
    }

    // 라인 확정 — slice 결과가 아니라 목표 텍스트 자체를 넣는다. 번역 후처리가
    // 문자열을 **줄이는** 경우가 있어 마지막 슬라이스가 최종본이 아닐 수 있다.
    function _lockLine() {
      if (!currentLine) return;
      currentLine.textContent = twTarget;
      announce(twTarget);
      currentLine = null;
      _twStop();
      _scrollToBottom();
    }

    function _twStep() {
      twRaf = 0;
      if (!currentLine) return;
      if (twShown > twTarget.length) twShown = twTarget.length;
      const gap = twTarget.length - twShown;
      if (gap > 0) {
        const step = Math.min(MAX_REVEAL_PER_FRAME, Math.max(2, Math.ceil(gap / 6)));
        twShown = Math.min(twTarget.length, twShown + step);
        currentLine.textContent = twTarget.slice(0, twShown);
        _scrollToBottom(); // 실제로 글자가 늘어난 프레임에서만 만진다
      }
      if (twShown >= twTarget.length) {
        // 따라잡았다. 최종 청크였으면 확정하고, 부분 청크였으면 다음 청크가
        // 올 때까지 루프를 쉰다 (idle 중 rAF 를 태우지 않는다).
        if (twFinalize) _lockLine();
        return;
      }
      twRaf = requestAnimationFrame(_twStep);
    }

    function _twStart() {
      if (twRaf || !currentLine) return;
      twRaf = requestAnimationFrame(_twStep);
    }

    function _ensureCurrentLine() {
      if (currentLine) return;
      const empty = document.getElementById("caption-empty");
      if (empty && empty.parentNode) empty.remove();
      const div = document.createElement("div");
      div.className = "caption-line";
      container.appendChild(div);
      while (container.children.length > MAX_LINES) {
        container.removeChild(container.firstChild);
      }
      currentLine = div;
      twTarget = "";
      twShown = 0;
      twFinalize = false;
    }

    // 부분(스트리밍) 청크 — 목표만 키우고 라인은 확정하지 않는다.
    function updatePartialCaption(text) {
      if (!text) return;
      _ensureCurrentLine();
      twTarget = text;
      _twStart();
    }

    // 최종 메시지 — 남은 글자를 마저 드러낸 뒤 라인을 확정한다.
    function finalizeCaption(text) {
      // 앞 라인이 아직 확정 대기 중인데 다음 final 이 도착하면 즉시 스냅해
      // 확정하고 새 라인을 연다 — SSE 가 몰아쳐도 라인이 합쳐지거나 유실되지
      // 않는다. viewer.html:495 에는 이 분기가 없어 연속 final 이 한 줄로
      // 합쳐진다 (여기서는 그 동작을 의도적으로 바꾼다).
      if (currentLine && twFinalize) _lockLine();
      _ensureCurrentLine();
      twTarget = text || twTarget || "";
      twFinalize = true;
      _twStart();
    }

    // 숨김 탭에서는 rAF 가 멈춘다. 남은 글자를 즉시 스냅해 두지 않으면 복귀
    // 순간 수백 자가 한꺼번에 몰아친다.
    // NFR-025: 이 페이지가 새로 등록하는 유일한 document 레벨 리스너다 —
    // 키 이벤트는 프레젠터 리모컨의 것이므로 끝까지 건드리지 않는다.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        _twStop();
        if (currentLine) {
          twShown = twTarget.length;
          currentLine.textContent = twTarget;
          _scrollToBottom();
          if (twFinalize) _lockLine();
        }
      } else {
        _twStart();
      }
    });

    function showError(visible) {
      if (connError) connError.classList.toggle("visible", !!visible);
    }

    // 상태 전환은 자막 컬럼 안에서만 일어난다 — 좌열(#event-header /
    // #presentation / #stage-frame / #title-card / #logo-bar)은 건드리지 않는다.
    function setCaptionState(name) {
      captionState = name;
      const ended = name === "ended";
      if (captionLive) captionLive.hidden = ended;
      if (captionEnded) captionEnded.hidden = !ended;
      if (ended) showError(false); // 종료된 세션에 재연결 힌트는 거짓말이다
    }

    function applyWaitingText(lang) {
      const empty = document.getElementById("caption-empty");
      if (empty) empty.textContent = WAITING_MSG[lang] || WAITING_MSG.ko;
    }

    // 자막 언어는 서버가 ?lang= 을 검증해 내려준 CONFIG.caption_lang 으로
    // 고정한다. 브라우저에서 쿼리를 다시 파싱하면 서버가 거부한 코드가
    // 되살아난다 (무대 화면에는 언어 전환 UI 도 없다 — NFR-025).
    function connect() {
      const url = "/stream/" + encodeURIComponent(CONFIG.room_id) +
                  "?lang=" + encodeURIComponent(CONFIG.caption_lang);
      try {
        es = new EventSource(url);
      } catch (e) {
        // 생성자는 잘못된 URL 에서만 동기적으로 던진다. 무대에는 재시도할
        // 사람이 없으므로 배너만 남기고 조용히 포기한다 (RL-006).
        showError(true);
        return;
      }

      es.addEventListener("open", function () { showError(false); });

      es.addEventListener("message", function (ev) {
        showError(false);
        let payload = null;
        try {
          payload = JSON.parse(ev.data);
        } catch (e) {
          return; // 깨진 프레임은 무시 — 파싱 오류를 화면에 옮기지 않는다 (RL-006)
        }
        if (!payload || typeof payload.text !== "string") return;
        if (captionState !== "active") setCaptionState("active");
        if (payload.partial) {
          updatePartialCaption(payload.text);
        } else {
          finalizeCaption(payload.text);
        }
      });

      es.addEventListener("session_end", function () {
        _twStop();
        currentLine = null;
        setCaptionState("ended");
        if (es) {
          try { es.close(); } catch (e) { /* noop */ }
          es = null;
        }
      });

      // EventSource 는 스스로 재연결한다 — 일시적 힌트만 띄운다.
      es.addEventListener("error", function () { showError(true); });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const $ = (id) => document.getElementById(id);
      const cfg = CONFIG.stage || {};

      // 서버가 렌더한 룸 이름(엔티티 디코딩 완료)이 타이틀 미설정 시 폴백이다.
      const headerTitle = $("event-title");
      const title = cfg.event_title || headerTitle.textContent.trim();
      headerTitle.textContent = title;
      $("card-title").textContent = title;

      const subtitle = cfg.event_subtitle || "";
      [$("event-subtitle"), $("card-subtitle")].forEach(function (el) {
        el.textContent = subtitle;
        el.hidden = !subtitle;
      });

      const logoBar = $("logo-bar");
      const cardLogos = $("card-logos");
      const groups = Array.isArray(cfg.logo_groups) ? cfg.logo_groups : [];
      let shown = 0;
      groups.forEach(function (group) {
        const assets = Array.isArray(group && group.assets) ? group.assets : [];
        if (assets.length === 0) return; // 자산 없는 그룹은 숨긴다
        const label = String((group && group.label) || "");
        const wrap = document.createElement("div");
        wrap.className = "logo-group";
        const caption = document.createElement("span");
        caption.className = "logo-group-label";
        caption.textContent = label;
        wrap.appendChild(caption);
        assets.forEach(function (name, i) {
          wrap.appendChild(makeLogoImage(name, i === 0 ? label + " 로고" : ""));
          cardLogos.appendChild(makeLogoImage(name, "")); // 타이틀 카드는 장식 반복
        });
        logoBar.appendChild(wrap);
        shown += 1;
      });
      // 전 그룹이 비면 바가 0 높이로 접히고 발표 영역이 그 공간을 갖는다.
      logoBar.hidden = shown === 0;

      // --- 자막 컬럼 부트스트랩 (ISSUE-41) ---------------------------------
      captionLive = $("caption-live");
      captionEnded = $("caption-ended");
      scroller = $("caption-scroll");
      container = $("caption-container");
      announcer = $("caption-announcer");
      connError = $("conn-error");
      applyWaitingText(CONFIG.caption_lang);

      // 종료된 룸은 종료 상태로 시작하고 EventSource 를 아예 열지 않는다.
      // (화면 캡처는 ISSUE-42 가 담당한다.
      //  NFR-025: 이 페이지는 document/window 레벨 키 이벤트를 등록하지 않고
      //  포커스/전체화면 API 도 자동 호출하지 않는다 — 프레젠터 리모컨이
      //  무대 창에 가로채이면 행사장에서 슬라이드가 넘어가지 않는다.)
      if (CONFIG.initial_state === "closed") {
        setCaptionState("ended");
      } else {
        setCaptionState("waiting");
        connect();
      }
    });
  </script>
</head>
<body>
  <div class="stage">
    <main class="stage-main">
      <header class="event-header" id="event-header">
        <h1 class="event-title" id="event-title">{{ROOM_NAME}}</h1>
        <p class="event-subtitle" id="event-subtitle" hidden></p>
      </header>

      <section class="presentation" id="presentation" aria-label="발표 화면">
        <div class="stage-frame" id="stage-frame">
          <!-- ISSUE-42 가 getDisplayMedia 스트림을 여기에 연결한다. -->
          <video class="capture-video" id="capture-video" autoplay muted playsinline hidden></video>
          <div class="title-card" id="title-card">
            <div class="title-card-title" id="card-title"></div>
            <div class="title-card-subtitle" id="card-subtitle" hidden></div>
            <div class="title-card-logos" id="card-logos"></div>
          </div>
        </div>
      </section>

      <footer class="logo-bar" id="logo-bar" hidden></footer>
    </main>

    <aside class="caption-column" id="caption-column" aria-label="자막">
      <div class="caption-live" id="caption-live">
        <div class="caption-scroll" id="caption-scroll">
          <!-- aria-hidden 은 의도된 것이다. 되돌리지 말 것 (RL-019).
               ISSUE-40(PR #122 UI-6)은 이 노드에 aria-live="polite" 를 붙인 채
               셸을 출하했지만, ISSUE-41 의 타자기가 바로 이 노드에
               .caption-line 을 append 하고 마지막 라인의 textContent 를 매
               requestAnimationFrame 마다 바꾸며 MAX_LINES 로 앞쪽 자식을
               잘라낸다 — 라이브 리전으로 두면 모든 공개 프레임과 모든 트리밍이
               스크린리더로 낭독된다. 라이브 리전 소유자는 아래
               #caption-announcer 이고, 라인이 **확정될 때만** 갱신된다. -->
          <div class="caption-container" id="caption-container" aria-hidden="true">
            <div class="caption-empty" id="caption-empty">잠시 후 시작됩니다</div>
          </div>
        </div>
      </div>
      <p class="sr-only" id="caption-announcer" aria-live="polite" aria-atomic="true"></p>
      <div class="caption-ended" id="caption-ended" role="status" hidden>
        세션이 종료되었습니다
      </div>
      <div class="conn-error" id="conn-error" role="status">
        연결이 끊어졌습니다. 재연결 중…
      </div>
    </aside>
  </div>
</body>
</html>
