<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Minimal-dark operator view (design #109): near-black canvas, monochrome
       captions (no cards/borders), thin ghost controls. Same language as
       the viewer. All selectors preserved for JS hooks. */
    *, html { box-sizing: border-box; }

    html { height: 100%; margin: 0; padding: 0; }

    body {
      margin: 0;
      padding: 4% 10px 10px 10px;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #0b0b0c;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden !important;
      height: 100% !important;
      max-height: 100% !important;
      position: relative;
    }

    :root {
      --translation-font-size: 28px;
      --original-font-size: 16px;
    }

    /* Floating controls — thin ghost circles */
    .settings-fab, .fullscreen-fab {
      position: fixed;
      right: 24px;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.75);
      z-index: 1001;
      backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }
    .settings-fab { top: calc(20px + 4%); }
    .fullscreen-fab { top: calc(76px + 4%); }
    .settings-fab svg, .fullscreen-fab svg { width: 20px; height: 20px; }

    .settings-fab:hover, .fullscreen-fab:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .settings-fab.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    /* Settings panel */
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      height: 100vh;
      background: #0e0e10;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding: 88px 28px 28px;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
    }
    .settings-panel.open { transform: translateX(0); }

    .settings-panel h2 {
      margin: 0 0 32px 0;
      color: #ffffff;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .control-group { margin-bottom: 28px; }
    .control-group label {
      display: block;
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .control-group button, .control-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .control-group button { margin-bottom: 12px; }
    .control-group button:hover, .control-group select:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.24);
    }
    .control-group button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .control-group select option { background: #151517; color: #ffffff; }

    .lang-warning {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
    }
    .lang-warning.visible { display: block; }

    /* Slider — monochrome */
    .slider {
      width: 100%;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      margin: 10px 0 12px 0;
      -webkit-appearance: none;
    }
    .slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
    .control-group span {
      display: inline-block;
      min-width: 60px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
      font-size: 13px;
    }

    /* Status — subtle pill with a single status dot */
    .status-overlay {
      position: absolute;
      bottom: 28px;
      left: 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 999;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .status-chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .status-chip.connected { color: #ffffff; }
    .status-chip.connected::before {
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.14);
    }
    .status-chip.connecting::before {
      background: rgba(255, 255, 255, 0.7);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .status-chip.error { color: rgba(255, 255, 255, 0.85); }
    .status-chip.error::before { background: #f87171; }

    /* Back-to-live — monochrome pill */
    .back-to-live {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      z-index: 998;
      backdrop-filter: blur(8px);
      transition: background 0.25s ease, transform 0.25s ease;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .back-to-live:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    /* Caption viewer */
    #viewer {
      height: 100% !important;
      max-height: 100% !important;
      width: 100%;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      scroll-behavior: smooth;
      display: flex;
      align-items: center;
      justify-content: center;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }
    #viewer::-webkit-scrollbar { display: none; }

    .caption-container {
      width: 100%;
      max-width: 1100px;
      padding: 40px 48px 96px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      min-height: 100%;
      box-sizing: border-box;
      justify-content: center;
    }

    /* No cards. Monochrome type only. */
    .caption-line {
      margin-bottom: 24px;
      line-height: 1.5;
      padding: 0;
      transition: color 0.4s ease, opacity 0.4s ease;
      word-break: keep-all;
      overflow-wrap: break-word;
      max-width: 100%;
      text-align: left;
      animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Original (source) — small, dimmed */
    .caption-line.original {
      font-size: var(--original-font-size);
      color: rgba(255, 255, 255, 0.38);
      font-weight: 400;
      margin-bottom: 8px;
      letter-spacing: 0;
    }
    .hide-original .caption-line.original { display: none !important; }
    .hide-translation .caption-line.stable,
    .hide-translation .caption-line.typing { display: none !important; }

    /* Confirmed translation — the hero line */
    /* Confirmed translation — dim by default, only the current line is white
       (#111): the latest sentence stands out, previous ones recede. */
    .caption-line.stable {
      font-size: var(--translation-font-size);
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .caption-line.stable.current { color: #ffffff; }

    /* Typing / forming translation — current line, white */
    .caption-line.typing {
      font-size: var(--translation-font-size);
      color: #ffffff;
      font-weight: 600;
      letter-spacing: -0.01em;
      position: relative;
    }
    /* #111/#112 visual clue: while a sentence is being formed (transcript in,
       translation not yet back), show breathing dots. Same size/rhythm as the
       viewer's listening indicator (6px dots), spacing kept tight. */
    .forming-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      vertical-align: middle;
    }
    .forming-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    .forming-dots span:nth-child(2) { animation-delay: 0.2s; }
    .forming-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.9; transform: translateY(-3px); }
    }

    /* Interim (unstable) — dim, lighter weight */
    .caption-line.unstable {
      font-size: calc(var(--translation-font-size) - 2px);
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }

    .caption-line.fade-in { animation: fadeInUp 0.4s ease-out forwards; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Fullscreen font controls */
    .fs-font-controls {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1010;
      opacity: 0.6;
      transition: opacity 0.4s ease;
      user-select: none;
    }
    .fs-font-controls:hover, .fs-font-controls:focus-within { opacity: 1; }
    .fs-font-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .fs-font-group:last-child { margin-bottom: 0; }
    .fs-font-label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      min-width: 28px;
      text-align: right;
    }
    .fs-font-btn {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease;
      padding: 0;
      line-height: 1;
    }
    .fs-font-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.32);
    }
    .fs-font-btn:active { transform: scale(0.92); }
    .fs-font-size {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      min-width: 32px;
      text-align: center;
    }

    /* Focus (WCAG 2.4.7) — monochrome ring */
    .settings-fab:focus-visible,
    .fullscreen-fab:focus-visible,
    .fs-font-btn:focus-visible {
      outline: none;
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.16);
    }
    .settings-fab:focus:not(:focus-visible),
    .fullscreen-fab:focus:not(:focus-visible) { outline: none; }

    /* Fullscreen */
    #viewer:fullscreen { background: #000; height: 100vh !important; max-height: 100vh !important; padding: 20px; }
    #viewer:fullscreen .caption-container { max-width: 100%; padding: 20px 56px 100px; }
    #viewer:fullscreen .fs-font-controls { display: flex; flex-direction: column; }
    /* ISSUE-49: `#viewer:fullscreen .welcome-state { color: ... }` 를 지웠다.
       그건 알파 텍스트가 더 어두운 backdrop 에서 잃는 대비를 되메우려는
       보정이었다. 웰컴 텍스트가 불투명 hex 가 된 지금은 되메울 손실이 없다 —
       합성이 없으므로 #000 쪽 대비가 오히려 올라간다. 분기를 되살리면 값
       하나가 두 backdrop 을 모두 커버한다는 성질이 깨진다. */
    #viewer:-webkit-full-screen { background: #000; height: 100vh !important; max-height: 100vh !important; padding: 20px; }
    #viewer:-webkit-full-screen .caption-container { max-width: 100%; padding: 20px 56px 100px; }
    #viewer:-webkit-full-screen .fs-font-controls { display: flex; flex-direction: column; }

    /* Welcome / idle screen — ISSUE-49: 텍스트 색은 전부 **불투명 hex** 다.
       이 화면은 두 backdrop 위에 래스터라이즈된다: body(#0b0b0c) 와
       전체화면의 #viewer(#000). 알파 텍스트는 backdrop 이 어두워질수록 대비가
       **내려가서**(0.45 → 4.52:1 / 4.43:1) 전체화면에서만 조용히 AA 를
       놓쳤다. 불투명이면 합성이 없어 더 어두운 쪽에서 대비가 올라가므로
       한 값이 두 backdrop 을 모두 커버한다.

       눈대중이 아니라 실측값이다 (RL-018) — 순서대로 #0b0b0c / #000:
         제목 #ffffff  19.67:1 / 21.00:1
         본문 #c8c8d2  11.85:1 / 12.65:1
         보조 #a8a8b3   8.35:1 /  8.92:1
       보조 텍스트의 #a8a8b3 은 같은 파일 `.stage-launch-hint`(ISSUE-47)와
       같은 값이다 — supporting-text 단계를 하나로 유지한다. 밝기 서열
       (제목 > 본문 > 보조)은 tests/test_webrtc_stage_launch.py 가, 실제로
       칠해지는 값은 tests/e2e/test_operator_welcome_contrast_e2e.py 가
       두 backdrop 모두에서 다시 계산해 검증한다. */
    .welcome-state {
      text-align: center;
      color: #c8c8d2;
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .welcome-state .icon {
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
    }
    .welcome-state .icon svg { width: 44px; height: 44px; }
    .welcome-state h1, .welcome-title {
      font-size: clamp(26px, 3.4vw, 34px);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #ffffff;
    }
    /* #112: 룸 이름 — 제목 아래 별도 줄, 대시 없이 */
    .welcome-room {
      font-size: 14px;
      letter-spacing: 0.03em;
      color: #a8a8b3;
      margin-bottom: 24px;
    }
    .welcome-state p, .welcome-desc {
      font-size: 16px;
      color: #c8c8d2;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .welcome-state .hint {
      font-size: 13px;
      color: #a8a8b3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .welcome-rules {
      margin-top: 18px;
      font-size: 13px;
      color: #a8a8b3;
      line-height: 1.7;
    }

    /* QR — white card kept for scannability, refined framing */
    .qr-code-container {
      display: none; /* JS shows it when BOOT.qr_data_url exists */
      margin: 32px auto 0;
      padding: 20px;
      background: #ffffff;
      border-radius: 18px;
      width: max-content;
      max-width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .qr-code-container img {
      display: block;
      margin: 0 auto;
      width: 220px;
      height: 220px;
      max-width: 60vmin;
      max-height: 60vmin;
      border-radius: 6px;
    }
    .qr-code-caption {
      margin: 14px auto 0;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.5);
      text-align: center;
      word-break: break-all;
      max-width: 320px;
      line-height: 1.5;
    }
    .qr-code-caption strong { color: rgba(0, 0, 0, 0.8); font-weight: 600; }

    /* ISSUE-47 — 무대 화면 열기 (표시 모드가 '무대 화면' 일 때만 JS 가 보여줌).
       색은 눈대중이 아니라 수치로 고른다 (RL-018): 버튼은 #ffffff on #1858c4
       = 6.50:1, 폴백 링크는 #9ec5ff on #0b0b0c = 11.13:1, 도움말은
       #a8a8b3 on #0b0b0c = 8.35:1 — 모두 WCAG AA(4.5:1) 위. 대비는
       tests/test_webrtc_stage_launch.py 가 합성값으로 다시 계산해 검증한다.

       세 색 모두 **불투명 hex** 인 것이 의도다. 이 컨트롤은 body(#0b0b0c) 위에도
       #viewer:fullscreen(#000) 위에도 렌더되는데, 알파를 쓰면 합성 backdrop 이
       바뀌어 두 값이 갈라진다 (RL-018 이 두 번 물린 지점). 불투명이면 #000 쪽이
       항상 더 어두워 대비가 올라가므로(각각 8.92:1 / 11.88:1) 한쪽만 계산해도
       구조적으로 안전하다 — 테스트가 두 backdrop 을 모두 확인한다.

       위치: `.status-overlay` / `.back-to-live` 와 같은 지속 오버레이 층에 둔다.
       `#captionContainer` 안에 두면 첫 자막에서 `appendLine()` 이 `.welcome-state`
       를 remove 하며 함께 사라진다 (코드 리뷰 F-1 / UI 리뷰 H-1, AC4 위반). */
    .stage-launch {
      display: none; /* JS shows it when BOOT.display_mode === 'stage' */
      position: absolute;
      top: 28px;
      left: 28px;
      z-index: 998;
      max-width: 300px;
      text-align: left;
    }
    .stage-launch-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #1858c4;
      border: 1px solid #1858c4;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .stage-launch-button:hover { background: #1a63dd; border-color: #1a63dd; }
    .stage-launch-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.55);
    }
    .stage-launch-hint {
      margin-top: 10px;
      /* 13px — 파일의 다른 보조 텍스트(.hint / .welcome-rules)와 같은 단계.
         12px 는 이 파일에서 유일한 예외가 되어 타입 스케일이 깨진다. */
      font-size: 13px;
      line-height: 1.6;
      color: #a8a8b3;
    }
    .stage-launch-fallback {
      display: none; /* JS reveals it only when the popup was blocked */
      margin-top: 10px;
      /* padding 으로 터치 타깃을 24px 이상으로 올린다 (WCAG 2.2 SC 2.5.8).
         이 링크는 팝업이 차단된 오퍼레이터의 유일한 탈출구이고 행사 중
         급하게 눌러야 하므로, 인라인 예외에 기대지 않는다. */
      padding: 6px 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #9ec5ff;
      word-break: break-all;
    }

    /* Responsive — width */
    @media (max-width: 768px) {
      body { padding: 4% 5px 5px 5px; height: 100% !important; max-height: 100% !important; }
      .settings-panel { width: 100%; }
      .caption-container { padding: 24px 22px 64px; }
      .caption-line { margin-bottom: 18px; }
      .caption-line.stable, .caption-line.typing { font-size: calc(var(--translation-font-size) * 0.82); }
      .caption-line.original { font-size: calc(var(--original-font-size) * 0.92); margin-bottom: 6px; }
      .status-overlay { bottom: 14px; left: 14px; }

<script>
  // Web Speech API + AWS WebSocket 연결 사용

try {
  // Bootstrap data
  const BOOT = {{BOOTSTRAP_JSON}};
  console.log('BOOT data:', BOOT);

  // Global state
  let awsWebSocket = null;
  let peerConnection = null;   // OpenAI WebRTC RTCPeerConnection
  let dataChannel = null;      // oai-events DataChannel
  let openaiWebSocket = null;  // 서버 번역 파이프라인 WebSocket
  let openaiSession = null;    // BOOT 에서 로드한 세션 (client_secret 포함)
  let localStream = null;
  let currentDeviceId = null;
  let startTime = null;
  let currentUnstableLine = null;
  let currentTypingLine = null;  // 🎨 타이핑 라인
  // #115: 타자기 스무딩 — Bedrock 이 여러 토큰을 큰 덩어리로 보내도 화면엔
  // 글자를 일정 속도로 흘려보내 부드럽고 빠른 느낌을 낸다.
  let twTarget = '';       // 목표 전체 텍스트 (누적/최종)
  let twShown = 0;         // 현재 화면에 보인 글자 수
  let twFinalize = false;  // 따라잡으면 stable 로 확정할지
  let twTimer = null;
  let responseInProgress = false;
  let currentResponseId = null;
  let pendingTranscript = null;
  let pendingTranslation = '';
  let lastProcessedTranscript = null;
  let lastTranslationRequest = null;
  let translationRequestTime = 0;
  let isPaused = false;
  let isUserScrolling = false;    // 🎯 사용자 스크롤 상태
  let lastAutoScrollTime = 0;     // 🎯 마지막 자동 스크롤 시간
  let speechStartTime = null;     // 🔊 음성 시작 시간
  let speechEndTime = null;       // 🔊 음성 종료 시간

  // DOM elements with null checks
  const viewer = document.getElementById('viewer');
  const captionContainer = document.getElementById('captionContainer');
  const selMic = document.getElementById('selMic');
  const statusEl = document.getElementById('status');
  const latencyEl = document.getElementById('latency');
  const btnPerm = document.getElementById('btnPerm');
  const settingsFab = document.getElementById('settingsFab');
  const settingsPanel = document.getElementById('settingsPanel');
  const backToLiveBtn = document.getElementById('backToLive');
  const fontSizeSlider = document.getElementById('fontSizeSlider');
  const fontSizeValue = document.getElementById('fontSizeValue');
  const originalSizeSlider = document.getElementById('originalSizeSlider');
  const originalSizeValue = document.getElementById('originalSizeValue');
  const showOriginalToggle = document.getElementById('showOriginalToggle');
  const showTranslationToggle = document.getElementById('showTranslationToggle');
  const selInputLang = document.getElementById('selInputLang');
  const selOutputLang = document.getElementById('selOutputLang');
  const langWarning = document.getElementById('langWarning');
  const fullscreenFab = document.getElementById('fullscreenFab');
  const fsFontControls = document.getElementById('fsFontControls');
  const fsTransSize = document.getElementById('fsTransSize');
  const fsOrigSize = document.getElementById('fsOrigSize');
  const fsTransPlus = document.getElementById('fsTransPlus');
  const fsTransMinus = document.getElementById('fsTransMinus');
  const fsOrigPlus = document.getElementById('fsOrigPlus');
  const fsOrigMinus = document.getElementById('fsOrigMinus');

  // Null check for critical elements
  if (!viewer || !captionContainer || !statusEl) {
    throw new Error('필수 DOM 요소를 찾을 수 없습니다.');
  }

  // localStorage에서 설정 불러오기
  const loadSettings = () => {
    // 원문 표시 설정 (기본값: false = 숨김)
    const showOriginal = localStorage.getItem('showOriginal') === 'true';
    if (showOriginalToggle) {
      showOriginalToggle.checked = showOriginal;
    }
    // 초기 상태 적용
    if (!showOriginal) {
      captionContainer.classList.add('hide-original');
    }

    // 번역문 표시 설정 (기본값: true = 표시)
    const showTranslation = localStorage.getItem('showTranslation') !== 'false';
    if (showTranslationToggle) {
      showTranslationToggle.checked = showTranslation;
    }
    // 초기 상태 적용
    if (!showTranslation) {
      captionContainer.classList.add('hide-translation');
    }

    // 폰트 크기 설정
    const translationSize = localStorage.getItem('translationFontSize') || '28';
    const originalSize = localStorage.getItem('originalFontSize') || '16';

    if (fontSizeSlider && fontSizeValue) {
      fontSizeSlider.value = translationSize;
      fontSizeValue.textContent = `${translationSize}px`;
      document.documentElement.style.setProperty('--translation-font-size', `${translationSize}px`);
    }

    if (originalSizeSlider && originalSizeValue) {
      originalSizeSlider.value = originalSize;
      originalSizeValue.textContent = `${originalSize}px`;
      document.documentElement.style.setProperty('--original-font-size', `${originalSize}px`);
    }

    // 언어 설정 (입력: 기본 auto, 출력: 기본 ko)
    const savedInputLang = localStorage.getItem('inputLanguage') || 'auto';
    const savedOutputLang = localStorage.getItem('outputLanguage') || 'ko';
    if (selInputLang) selInputLang.value = savedInputLang;
    if (selOutputLang) selOutputLang.value = savedOutputLang;
    checkLangWarning();
    updateWelcomeTranslationRules();
  };

  // 언어 이름 매핑
  const LANG_NAMES = {
    auto: '자동 감지',
    ko: '한국어',
    zh: '중국어',
    en: '영어',
    vi: '베트남어',
  };

  // 입력=출력 경고 체크 (auto 제외)
  function checkLangWarning() {
    if (!langWarning || !selInputLang || !selOutputLang) return;
    const inputVal = selInputLang.value;
    const outputVal = selOutputLang.value;
    if (inputVal !== 'auto' && inputVal === outputVal) {
      langWarning.classList.add('visible');
    } else {
      langWarning.classList.remove('visible');
    }
  }

  // ISSUE-32: 웰컴 화면의 QR 컨테이너에 BOOT.qr_data_url 을 주입한다.
  // BOOT.qr_data_url 이 없으면 컨테이너를 숨겨 admin/룸 미선택 경로의 회귀를 막는다.
  // RL-006: BOOT 값이 비정상이어도 try/catch 로 캡션 UI 자체는 절대 깨지지 않게.
  function applyQrCodeToWelcome() {
    try {
      const containers = document.querySelectorAll('[data-qr-container]');
      const dataUrl = (BOOT && BOOT.qr_data_url) ? BOOT.qr_data_url : '';
      const viewUrl = (BOOT && BOOT.view_url) ? BOOT.view_url : '';
      containers.forEach(c => {
        const img = c.querySelector('[data-qr-img]');
        const urlEl = c.querySelector('[data-qr-url]');
        if (dataUrl && img) {
          img.src = dataUrl;
          c.style.display = 'block';
          if (urlEl) urlEl.textContent = viewUrl;
        } else {
          c.style.display = 'none';
          if (img) img.removeAttribute('src');
          if (urlEl) urlEl.textContent = '';
        }
      });
      // 설정 패널의 QR 그룹은 별도 wrapper(.control-group) 가 있어 따로 토글한다.
      const settingsQrGroup = document.getElementById('settingsQrGroup');
      if (settingsQrGroup) {
        settingsQrGroup.style.display = dataUrl ? 'block' : 'none';
      }
    } catch (err) {
      console.warn('[QR] applyQrCodeToWelcome 실패 — QR 표시를 건너뜁니다.', err);
    }
  }

  // ISSUE-47: 표시 모드가 '무대 화면' 일 때 "무대 화면 열기" 버튼을 붙인다.
  //
  // 설계 메모 — 왜 새 창인가 (NFR-029, 근거는 실측 후 개정됨):
  // 원래 근거였던 "컴포넌트 iframe 은 display-capture 권한을 못 받는다" 는
  // 실측에서 반증되었다. `allow` 에서 생략된 기능은 기본 허용목록(`self`)으로
  // 폴백하므로 부재는 거부가 아니다. 그럼에도 새 창을 쓰는 이유는 제품 특성:
  // 무대 화면은 프로젝터 출력이라 보조 디스플레이로 옮겨 독립적으로
  // 전체화면되어야 하고, 임베드하면 오퍼레이터 탭 자체가 캡처 소스 후보가 되어
  // FR-081 self-capture 위험이 커진다.
  //
  // clearViewer 가 welcome-state 를 innerHTML 로 다시 그리므로 이 함수는
  // 매번 새 노드에 리스너를 단다 — 중복 등록이 생기지 않는다.
  function applyStageLaunchToWelcome() {
    try {
      const stageUrl = (BOOT && BOOT.stage_url) ? BOOT.stage_url : '';
      // 하위호환: display_mode 가 없는 예전 payload 는 '일반 자막' 으로 본다.
      const isStageMode = !!(BOOT && BOOT.display_mode === 'stage');
      const containers = document.querySelectorAll('[data-stage-launch]');
      containers.forEach(c => {
        const button = c.querySelector('[data-stage-open]');
        const fallback = c.querySelector('[data-stage-fallback]');
        // 룸이 없으면 stage_url 도 없다 — 버튼을 띄우면 죽은 링크가 된다.
        if (!isStageMode || !stageUrl || !button) {
          c.style.display = 'none';
          return;
        }
        c.style.display = 'block';
        if (fallback) {
          fallback.style.display = 'none';
          fallback.href = stageUrl;
        }
        // 이 노드는 이제 지속 오버레이라 절대 다시 만들어지지 않는다. 따라서
        // 리스너를 두 번 달면 클릭 한 번에 창이 두 개 열린다 — 예전에는
        // clearViewer 가 노드를 통째로 갈아치워서 우연히 안전했을 뿐이다.
        if (c.dataset.stageBound === '1') return;
        c.dataset.stageBound = '1';
        button.addEventListener('click', () => {
          // 팝업 차단을 피하려면 클릭 핸들러의 **동기 실행 경로**에서 바로
          // 호출해야 한다. await/setTimeout 뒤로 밀면 사용자 제스처와의
          // 연결이 끊겨 대부분의 브라우저가 팝업으로 간주해 차단한다.
          //
          // windowFeatures 에 'noopener' 를 넣지 않는다: 그러면 사양상
          // window.open 이 **항상 null 을 반환**해, 정상적으로 열린 창까지
          // 차단으로 오판하고 폴백을 띄우게 된다. opener 는 아래에서 끊는다.
          //
          // windowFeatures 를 주는 이유(NFR-029): 아무 feature 도 주지 않으면
          // 크롬/엣지/파이어폭스는 새 **탭**을 연다. 무대 화면은 프로젝터로
          // 내보내야 하므로 오퍼레이터가 탭을 먼저 뜯어내야 하는 것은 이 이슈가
          // 없애려던 수고 그 자체다. `popup` 은 null 반환을 유발하지 않는다 —
          // 그렇게 만드는 것은 noopener/noreferrer 뿐이다.
          let opened = null;
          try {
            opened = window.open(stageUrl, '_blank', 'popup=yes,width=1280,height=720');
          } catch (err) {
            // RL-006: 내부 예외는 콘솔에만. 화면에는 폴백 링크만 보여준다.
            console.warn('[Stage] window.open 실패 — 폴백 링크를 노출합니다.', err);
          }
          if (opened) {
            try {
              // 무대 창이 오퍼레이터 탭을 조작하지 못하게 참조를 끊는다.
              opened.opener = null;
            } catch (err) {
              console.debug('[Stage] opener 해제 불가 (무시 가능).', err);
            }
            if (fallback) fallback.style.display = 'none';
            return;
          }
          // 차단됨 — 같은 자리에 클릭 가능한 대체 링크를 노출한다.
          // aria-live 리전을 새로 만들지 않는다(페이지당 announcer 는 하나).
          // 대신 포커스를 옮겨 스크린리더가 링크를 자연스럽게 읽게 한다.
          if (fallback) {
            fallback.style.display = 'block';
            fallback.focus();
          }
        });
      });
    } catch (err) {

      const requestFn = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
      if (requestFn) requestFn.call(viewer);
      else console.warn('Fullscreen API not supported in this environment');
    }
  }

  function updateFsFont(target, delta) {
    if (target === 'translation') {
      fsTranslationSize = Math.max(14, Math.min(80, fsTranslationSize + delta));

  // 토스트 메시지
  function showToast(message, type = 'info') {
    // #112: 컨퍼런스 중 상단 토스트는 화면을 가려 방해가 된다. 진단은
    // 콘솔로만 남기고 화면에는 띄우지 않는다.

  // 🎨 타이핑 번역 함수들
  // #115: 타자기 스무딩 루프 — twTarget 을 향해 twShown 을 조금씩 늘려
  // 화면에 글자를 흘려보낸다. Bedrock 이 큰 덩어리로 줘도 부드럽게 보인다.
  function _twStop() {
    if (twTimer) {
      clearInterval(twTimer);
      twTimer = null;
    }
  }

  function _twStart() {
    if (twTimer || !currentTypingLine) return;
    twTimer = setInterval(() => {
      if (!currentTypingLine) {
        _twStop();
        return;
      }
      // 확정 텍스트가 정리(clean)되며 짧아졌으면 클램프.
      if (twShown > twTarget.length) twShown = twTarget.length;
      const gap = twTarget.length - twShown;
      if (gap > 0) {
        // gap 비례 + 최소 2자 → 긴 덩어리는 빠르게 따라잡고 짧으면 부드럽게.
        const step = Math.max(2, Math.ceil(gap / 6));
        twShown = Math.min(twTarget.length, twShown + step);
        currentTypingLine.textContent = twTarget.slice(0, twShown);
        autoScrollToBottom();
      }
      if (twShown >= twTarget.length) {
        if (twFinalize) {
          const el = currentTypingLine;
          captionContainer
            .querySelectorAll('.caption-line.current')
            .forEach((n) => n.classList.remove('current'));
          el.className = 'caption-line stable fade-in current';
          el.textContent = twTarget;
          currentTypingLine = null;
          _twStop();
        } else {
          // 다음 partial 을 기다리며 유휴 — CPU 아끼려 멈춘다.
          _twStop();
        }
      }
    }, 28);
  }

  function startTypingTranslation() {
    _twStop();
    twTarget = '';
    twShown = 0;
    twFinalize = false;
    if (currentTypingLine) {
      currentTypingLine.remove();
    }
    // #114: 새 문장이 생성되기 시작하면 이전 확정 문장은 즉시 회색으로
    // (스트리밍 중 현재 typing 줄만 흰색으로 부각).
    captionContainer
      .querySelectorAll('.caption-line.current')
      .forEach((n) => n.classList.remove('current'));
    currentTypingLine = document.createElement('div');
    currentTypingLine.className = 'caption-line typing fade-in';
    // #112: 생성 중 표시 — 뷰어와 동일한 점 인디케이터(촘촘한 간격).
    // 첫 partial 이 오면 스무딩 루프가 textContent 로 덮어쓴다.
    currentTypingLine.innerHTML =
      '<span class="forming-dots"><span></span><span></span><span></span></span>';
    captionContainer.appendChild(currentTypingLine);

    // 🎯 사용자 스크롤 상태 확인 후 자동 스크롤
    autoScrollToBottom();
  }

  function updateTypingTranslation(text) {
    if (!currentTypingLine) return;
    // #115: 누적 목표를 갱신하고 스무딩 루프가 따라잡게 한다 (즉시 점프 금지).
    twTarget = text || '';
    _twStart();
  }

  function completeTypingTranslation(text) {
    if (!currentTypingLine) return;
    // #115: 최종 텍스트를 목표로 두고 finalize — 루프가 다 흘려보낸 뒤
    // stable(현재 줄=흰색)로 확정한다.
    twTarget = text || '';
    twFinalize = true;
    _twStart();
  }

  // 자막 추가 함수
  function appendLine(text, className = 'stable') {
    if (!text || !text.trim()) return;

    const welcomeState = captionContainer.querySelector('.welcome-state');
    if (welcomeState) {
      welcomeState.remove();
    }

    if (className === 'unstable') {
      if (!currentUnstableLine) {
        currentUnstableLine = document.createElement('div');
        currentUnstableLine.className = `caption-line ${className}`;
        currentUnstableLine.textContent = '';
        captionContainer.appendChild(currentUnstableLine);
      }
      const needsSpace = currentUnstableLine.textContent.length > 0 && !text.startsWith(' ');
      currentUnstableLine.textContent += (needsSpace ? ' ' : '') + text.trim();
    } else {
      const div = document.createElement('div');
      div.className = `caption-line ${className} fade-in`;
      div.textContent = text.trim();
      captionContainer.appendChild(div);
    }

    // 🎯 사용자가 스크롤 중이 아닐 때만 자동 스크롤
    autoScrollToBottom();

    // 자막 히스토리 관리
    const captionLines = captionContainer.querySelectorAll('.caption-line');
    if (captionLines.length > 100) {
      captionLines[0].remove();
    }
  }

  // 🎯 개선된 스크롤 상태 관리
  function updateScrollState() {
    const scrollTop = viewer.scrollTop;
    const scrollHeight = viewer.scrollHeight;
    const clientHeight = viewer.clientHeight;
    const isAtBottom = scrollTop >= (scrollHeight - clientHeight - 50);

    console.log('📊 스크롤 상태:', { scrollTop, scrollHeight, clientHeight, isAtBottom });

    // 맨 아래 근처에 있으면 자동 스크롤 모드
    if (isAtBottom) {
      isUserScrolling = false;
    }

    // 실시간으로 버튼 표시/숨김 (개선된 로직)
    if (backToLiveBtn) {
      const now = Date.now();

      // 🔧 최근 자동 스크롤 직후에는 버튼 표시 안함
      if (now - lastAutoScrollTime < 1000) {  // 1초간 버튼 숨김
        backToLiveBtn.style.display = 'none';
        return;
      }

      if (!isAtBottom && isUserScrolling) {
        backToLiveBtn.style.display = 'flex';
      } else {
        backToLiveBtn.style.display = 'none';
      }
    }
  }

  // 🎯 사용자 스크롤 감지 (터치/마우스 이벤트)
  let scrollTimer = null;
  viewer.addEventListener('scroll', (e) => {
    const now = Date.now();

    // 🔧 최근 자동 스크롤이 아닌 경우에만 사용자 스크롤로 간주
    if (now - lastAutoScrollTime > 800) {  // 800ms로 여유 확대
      isUserScrolling = true;
      console.log('🔄 User scrolling detected - auto scroll disabled');
    }

    // 🔧 스크롤 끝난 후 상태 업데이트 (딜레이 증가)
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      updateScrollState();
    }, 250);  // 250ms로 딜레이 증가
  });

  // 🎯 자동 스크롤 함수 (margin-top 고려)
  function autoScrollToBottom() {
    if (!isUserScrolling) {
      lastAutoScrollTime = Date.now();  // 자동 스크롤 시간 기록

      // 🔧 DOM 업데이트 완료 후 스크롤 실행
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {  // 이중 RAF로 DOM 안정화 대기
          // margin-top을 고려한 스크롤 높이 계산
          const scrollHeight = Math.max(viewer.scrollHeight, captionContainer.scrollHeight);
          viewer.scrollTo({
            top: scrollHeight,
            behavior: 'smooth'
          });
          console.log('🔽 Auto scroll triggered, scrollHeight:', scrollHeight);

          // 🔧 스크롤 완료 후 상태 업데이트 (딜레이 추가)
          setTimeout(() => {
            if (!isUserScrolling) {  // 여전히 자동 모드면
              updateScrollState();
            }
          }, 200);  // 스크롤 애니메이션 완료 대기
        });
      });
    } else {
      console.log('⏸️ Auto scroll skipped - user is scrolling');
    }
  }

  // Permission and device handling
  async function ensurePermission() {
    try {
      logStatus('권한 요청 중', 'connecting');

      const permissionStatus = await navigator.permissions.query({name: 'microphone'});
      if (permissionStatus.state === 'denied') {
        throw new Error('마이크 권한이 차단되었습니다.');
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          sampleRate: 16000  // ⚡ AudioContext와 일치시켜 리샘플링 오버헤드 제거
        }
      });

      stream.getTracks().forEach(track => track.stop());
      logStatus('권한 허용됨', 'connected');
      return true;
    } catch (error) {
      logStatus('권한 필요', 'error');
      showToast('마이크 권한이 필요합니다', 'warning');
      return false;
    }
  }

  async function listMics() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioInputs = devices.filter(d => d.kind === 'audioinput');

      if (selMic) {
        selMic.innerHTML = '<option value="">마이크를 선택하세요</option>';

        if (audioInputs.length === 0) {
          selMic.innerHTML = '<option value="">마이크를 찾을 수 없습니다</option>';
          return;
        }

        audioInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `마이크 ${index + 1}`;
          selMic.appendChild(option);
        });

        if (!currentDeviceId && audioInputs.length > 0) {
          const defaultDevice = audioInputs.find(d => d.deviceId === 'default') || audioInputs[0];
          currentDeviceId = defaultDevice.deviceId;
          selMic.value = currentDeviceId;
        }

        selMic.disabled = false;
      }
    } catch (error) {
      showToast('장치 목록을 가져올 수 없습니다', 'error');
    }
  }

  async function getStream(deviceId) {
    try {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      const constraints = {
        audio: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          sampleRate: 16000,  // ⚡ AudioContext와 일치
          channelCount: 1
        }
      };

      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      currentDeviceId = deviceId;
      return localStream;
    } catch (error) {
      throw new Error('오디오 스트림을 가져올 수 없습니다.');
    }
  }

  // OpenAI Realtime API 연결 초기화

  // OpenAI 세션 데이터 가져오기 (bootstrap에서)
  function getOpenAISession() {
    if (!BOOT.openai_session) {
      throw new Error('OpenAI 세션이 없습니다. 시작 버튼을 눌러주세요.');
    }
    console.log('✅ OpenAI 세션 로드:', BOOT.openai_session);
    return BOOT.openai_session;
  }

  async function initializeOpenAIConnection() {
    try {
      openaiSession = getOpenAISession();

      // RTCPeerConnection 설정
      peerConnection = new RTCPeerConnection();

      // DataChannel 생성 - OpenAI 메시지용
      dataChannel = peerConnection.createDataChannel('oai-events', {
        ordered: true
      });

      dataChannel.onopen = () => {
        console.log('✅ DataChannel 연결됨');
        // GA: 세션 설정(전사 모델·VAD·instructions·output_modalities)은
        // 서버가 client_secret 발급 시 이미 전부 고정한다 (services.py).
        // beta 시절의 session.update 재전송은 GA 에서 "Missing required
        // parameter: 'session.type'" 에러만 내는 중복이라 제거 (#89).
      };

      dataChannel.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          handleOpenAIMessage(message);
        } catch (error) {
          console.error('❌ DataChannel 메시지 파싱 오류:', error);
        }
      };

      dataChannel.onerror = (error) => {
        console.error('❌ DataChannel 오류:', error);
      };

      dataChannel.onclose = () => {
        console.log('🔌 DataChannel 연결 종료');
      };

      // WebSocket 연결 (app.py의 OpenAI handler와 통신용)
      // ALB 경로 기반 라우팅 사용: /ws 경로로 연결
      let hostname = window.location.hostname;

      // about:srcdoc 환경에서는 부모 창의 hostname 사용
      if (!hostname || hostname === '' || window.location.href.startsWith('about:')) {
        try {
          hostname = window.parent.location.hostname;
        } catch (e) {
          // Cross-origin 제한시 기본값 사용
          hostname = 'localhost';
        }
      }

      // 현재 페이지 프로토콜에 맞춰 WebSocket 프로토콜 결정
      const isHTTPS = window.location.protocol === 'https:' ||
                      (window.parent && window.parent.location.protocol === 'https:');

      const wsProtocol = isHTTPS ? 'wss:' : 'ws:';

      // ALB 경로 기반 라우팅: 포트 없이 /ws 경로 사용
      const wsUrl = hostname === 'localhost'
        ? `${wsProtocol}//localhost:${BOOT.websocket_port || 8765}` // 로컬 개발
        : `${wsProtocol}//${hostname}/ws`; // 배포 환경

      console.log(`🔗 WebSocket 연결 시도: ${wsUrl} (HTTPS: ${isHTTPS})`);

      openaiWebSocket = new WebSocket(wsUrl);

      openaiWebSocket.onopen = () => {
        console.log(`✅ OpenAI WebSocket 연결됨: ${wsUrl}`);

        // 사용자 정보 + 언어 설정 전송 (ISSUE-2)
        if (BOOT.user_info) {
          const inputLang = selInputLang ? selInputLang.value : 'auto';
          const outputLang = selOutputLang ? selOutputLang.value : 'ko';
          // ISSUE-28: 서버는 auth.room_id 로 룸 격리를 수행한다.
          // BOOT.room_id 가 비어 있으면 'default' 룸으로 폴백해 ISSUE-27
          // 이전 동작 (단일 룸) 과의 하위 호환을 유지한다.
          const authRoomId = BOOT.room_id || 'default';
          openaiWebSocket.send(JSON.stringify({
            type: 'auth',
            user: BOOT.user_info,
            room_id: authRoomId,
            language_settings: {
              input_lang: inputLang,
              output_lang: outputLang
            }
          }));
          console.log('[Auth] 사용자 정보 전송:', BOOT.user_info.username,
                       '룸:', authRoomId,
                       '언어:', inputLang, '->', outputLang);
        }
      };

      openaiWebSocket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleTranslationMessage(data);
        } catch (error) {
          console.error('❌ WebSocket 메시지 파싱 오류:', error);
        }
      };

      openaiWebSocket.onerror = (error) => {
        console.error(`❌ OpenAI WebSocket 오류 (${wsUrl}):`, error);
      };

      openaiWebSocket.onclose = (event) => {
        console.log(`🔌 OpenAI WebSocket 연결 종료 (${wsUrl}): Code ${event.code}`);
      };

      return true;
    } catch (error) {
      console.error('❌ OpenAI 연결 초기화 실패:', error);
      throw error;
    }
  }

  // OpenAI Realtime API 메시지 처리
  function handleOpenAIMessage(message) {
    console.log('[OpenAI] 메시지 수신:', message);

    switch (message.type) {
      case 'session.created':
        console.log('✅ OpenAI 세션 생성됨');
        logStatus('🎤 음성 인식 중', 'connected');
        break;

      case 'conversation.item.input_audio_transcription.completed':
        if (message.transcript) {
          const transcript = message.transcript.trim();
          console.log('[OpenAI Transcript]', transcript);

          // 원문 표시 (언어 표기 제거)
          appendLine(transcript, 'original');

          // WebSocket을 통해 app.py로 번역 요청 전송
          if (openaiWebSocket && openaiWebSocket.readyState === WebSocket.OPEN) {
            // 실제 음성 길이 계산
            let audioDurationSeconds = 0;
            if (speechStartTime && speechEndTime && speechEndTime > speechStartTime) {
              audioDurationSeconds = Math.max(0, (speechEndTime - speechStartTime) / 1000);
              console.log('[Speech Timing] 실제 음성 길이:', audioDurationSeconds, '초');
            } else {
              console.log('[Speech Timing] 타이밍 정보 없음, 서버에서 추정 필요');
            }

            openaiWebSocket.send(JSON.stringify({
              type: 'transcript',
              text: transcript,
              audio_duration_seconds: audioDurationSeconds,
              timestamp: Date.now()
            }));

            // #111: 번역이 서버에서 오는 동안(약 1초) 비어 보이지 않도록
            // "생성 중" forming 버블(점 애니메이션)을 즉시 띄운다. 이후
            // transcription_result 가 이 버블을 그대로 채운다.
            startTypingTranslation();

            // 타이밍 변수 초기화
            speechStartTime = null;
            speechEndTime = null;
          }
        }
        break;

      case 'input_audio_buffer.speech_started':
        speechStartTime = Date.now();
        console.log('[Speech Timing] 음성 시작:', speechStartTime);
        logStatus('음성 감지됨', 'connecting');
        break;

      case 'input_audio_buffer.speech_stopped':
        speechEndTime = Date.now();
        console.log('[Speech Timing] 음성 종료:', speechEndTime);
        logStatus('음성 처리 중', 'connecting');
        break;

      case 'error':
        console.error('[OpenAI] 오류:', message.error);
        logStatus('오류', 'error');
        showToast(`OpenAI 오류: ${message.error.message || message.error}`, 'error');
        break;

      default:
        console.log('[OpenAI Unhandled]', message.type);
        break;
    }
  }

  // 번역 결과 처리 (app.py WebSocket에서)
  function handleTranslationMessage(data) {
    console.log('[Translation] 메시지 수신:', data);

    switch (data.type) {
      case 'translation_partial':
        // #114: Bedrock 스트리밍 부분 번역 — forming 버블을 누적 텍스트로
        // 실시간 갱신(점 → 글자). 최종 확정은 transcription_result 가 한다.
        if (data.text) {
          if (!currentTypingLine) startTypingTranslation();
          updateTypingTranslation(data.text);
        }
        break;

      case 'transcription_result':
        // 번역된 텍스트가 있으면 표시
        if (data.translated_text && data.translated_text !== data.original_text) {
          // 전사 완료 시 미리 만들어 둔 forming 버블(생성중 점)을 그대로 채운다.
          if (!currentTypingLine) startTypingTranslation();
          completeTypingTranslation(data.translated_text);
        } else if (currentTypingLine) {
          // 번역이 원문과 동일(동일 언어) — 대기 중이던 forming 버블 제거.
          currentTypingLine.remove();
          currentTypingLine = null;
        }

        // 사용량 정보 업데이트 (Streamlit 부모 프레임에 메시지 전송)
        if (data.remaining_seconds !== undefined) {
          console.log('[Usage Update] 남은 시간:', data.remaining_seconds, '초');
          try {
            window.parent.postMessage({
              type: 'usage_update',
              remaining_seconds: data.remaining_seconds,
              user_id: data.user_id,
              timestamp: Date.now()
            }, '*');
          } catch (error) {
            console.warn('[Usage Update] 부모 프레임 메시지 전송 실패:', error);
          }
        }
        break;

      case 'connection':
        console.log('[Translation] 연결 상태:', data.status);
        break;

      case 'auth_success':
        console.log('[Translation] 인증 성공:', data.message);
        break;

      case 'usage_exceeded':
        console.error('[Usage] 사용량 초과:', data.message);
        showToast(data.message, 'error');
        // 연결 중단
        if (openaiWebSocket) {
          openaiWebSocket.close();
        }
        closeConnection();
        break;

      case 'language_mismatch':
        console.warn(`[Lang] 언어 불일치: expected=${data.expected}, detected=${data.detected}`);
        showToast(`입력 언어 불일치: ${LANG_NAMES[data.expected] || data.expected} 설정인데 ${LANG_NAMES[data.detected] || data.detected}가 감지됨`, 'warning');
        break;

      case 'error':
        console.error('[Translation] 오류:', data.message);
        showToast(`번역 오류: ${data.message}`, 'error');
        if (currentTypingLine) {
          currentTypingLine.remove();
          currentTypingLine = null;
        }
        break;

      default:
        console.log('[Translation] 알 수 없는 메시지 타입:', data.type);
        break;
    }
  }

  // OpenAI Realtime API 연결 (WebRTC)
  async function connectOpenAIRealtime() {
    try {
      logStatus('연결 중', 'connecting');
      startTime = Date.now();

      await initializeOpenAIConnection();

      if (!localStream && currentDeviceId) {
        localStream = await getStream(currentDeviceId);
      } else if (!localStream) {
        throw new Error('마이크가 선택되지 않았습니다.');
      }

      // 오디오 트랙을 RTCPeerConnection에 추가
      localStream.getAudioTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // SDP Offer 생성
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      console.log('📤 SDP Offer 생성됨');

      // OpenAI Realtime GA: SDP 교환은 /v1/realtime/calls 로 POST.
      // 모델·세션 설정은 client_secret 발급 시 서버가 이미 고정했으므로
      // 쿼리 파라미터가 없다 (구 /v1/realtime?model= 은 GA 에서 400).
      const response = await fetch('https://api.openai.com/v1/realtime/calls', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${openaiSession.client_secret}`,
          'Content-Type': 'application/sdp'
        },
        body: offer.sdp
      });

      if (!response.ok) {
        const errBody = await response.text().catch(() => '');
        throw new Error(`OpenAI API 요청 실패: ${response.status} ${errBody.slice(0, 300)}`);
      }

      const answerSdp = await response.text();
      console.log('📥 SDP Answer 수신됨');

      const answer = {
        type: 'answer',
        sdp: answerSdp
      };

      await peerConnection.setRemoteDescription(answer);
      console.log('✅ OpenAI WebRTC 연결 완료');

      logStatus('🎤 음성 인식 중', 'connected');

    } catch (error) {
      console.error('❌ OpenAI 연결 실패:', error);
      logStatus('연결 실패', 'error');
      showToast(error.message || 'OpenAI 연결에 실패했습니다', 'error');
      closeConnection();
      throw error;
    }
  }

  // 번역 요청 스마트 필터링 함수
  function shouldRequestTranslation(transcript) {
    const now = Date.now();

    // 1. 이미 번역 진행 중이면 스킵
    if (responseInProgress) {
      console.log('[Skip Translation] Already in progress');
      return false;
    }

    // 2. 같은 내용 또는 매우 유사한 내용이면 스킵
    if (lastTranslationRequest === transcript) {
      console.log('[Skip Translation] Duplicate request');
      return false;
    }

    // 3. 이전 요청이 부분 문자열인경우 스킵 (확장된 내용)
    if (lastTranslationRequest && transcript.startsWith(lastTranslationRequest) &&
        transcript.length - lastTranslationRequest.length < 10) {
      console.log('[Skip Translation] Minor extension of previous request');
      return false;
    }

    // 4. 너무 빠른 연속 요청 방지 (디바운싱)
    if (now - translationRequestTime < 1000) { // 1초 간격
      console.log('[Skip Translation] Too frequent requests');
      return false;
    }

    return true;
  }

  // 영어 문장 완성도 체크 함수 추가
  function isTranscriptComplete(transcript) {
    // 최소 길이 체크 (영어는 3글자 이상)
    if (transcript.length < 3) {
      return false;
    }

    // 문장 부호로 끝나면 완성된 것으로 간주
    if (/[.!?]$/.test(transcript)) {
      return true;
    }

    // 단어가 완전히 끝났는지 체크 (공백이나 구두점 뒤 완전한 단어)
    const words = transcript.split(/\s+/);
    const lastWord = words[words.length - 1];

    // 마지막 단어가 너무 짧으면 불완전할 가능성
    if (lastWord.length < 2) {
      return false;
    }

    // 일반적인 불완전 단어 패턴들
    const incompletePatterns = [
      /ing$/,  // -ing로 끝나는 경우는 대부분 완성
      /ed$/,   // -ed로 끝나는 경우도 완성
      /[aeiou]$/,  // 모음으로 끝나면 보통 완성
      /[bcdfghjklmnpqrstvwxyz]{2,}$/  // 자음 2개 이상으로 끝나면 보통 완성
    ];

    // 패턴 매칭으로 완성도 판단
    return incompletePatterns.some(pattern => pattern.test(lastWord.toLowerCase()));
  }

  function closeConnection() {
    try {
      // AWS WebSocket 연결 해제
      if (awsWebSocket) {
        awsWebSocket.close();
        awsWebSocket = null;
      }

      // OpenAI WebRTC/WS 연결 해제 — 정지 시 토큰 만료를 기다리지 않고
      // 즉시 끊는다 (CLAUDE.md: immediate RTCPeerConnection close)
      if (dataChannel) {
        dataChannel.close();
        dataChannel = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (openaiWebSocket) {
        openaiWebSocket.close();
        openaiWebSocket = null;
      }

      // 오디오 스트림 정리
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      // 상태 초기화
      currentUnstableLine = null;
      currentTypingLine = null;
      responseInProgress = false;
      currentResponseId = null;
      pendingTranscript = null;
      pendingTranslation = '';
      lastProcessedTranscript = null;
      lastTranslationRequest = null;
      translationRequestTime = 0;
      isPaused = false;
      isUserScrolling = false;
      lastAutoScrollTime = 0;

      logStatus('대기중', '');
      logLatency(0);
      if (backToLiveBtn) {
        backToLiveBtn.style.display = 'none';
      }

      console.log('[AWS] Connection closed and resources cleaned up');
    } catch (error) {
      console.error('Close connection error:', error);
    }
  }

  // Event handlers
  if (btnPerm) {
    btnPerm.onclick = async () => {
      const success = await ensurePermission();
      if (success) {
        await listMics();
      }
    };
  }

  // 🚫 일시정지 버튼 이벤트 리스너 제거
  // if (btnPause) { ... } ← 삭제

  if (selMic) {
    selMic.onchange = async (event) => {
      const newDeviceId = event.target.value;
      if (!newDeviceId) return;

      const wasConnected = peerConnection && peerConnection.connectionState === 'connected';
      currentDeviceId = newDeviceId;

      if (wasConnected) {
        try {
          logStatus('장치 변경 중', 'connecting');
          closeConnection();

          // 새 오디오 스트림 준비
          const newStream = await getStream(newDeviceId);

          // OpenAI 연결 재시작
          setTimeout(async () => {
            try {
              await connectOpenAIRealtime();
            logStatus('연결됨', 'connected');
            } catch (error) {
              logStatus('장치 변경 실패', 'error');
              selMic.value = currentDeviceId;
          }
          }, 1000);

        } catch (error) {
          logStatus('장치 변경 실패', 'error');
          selMic.value = currentDeviceId;
        }
      }
    };
  }


  (async () => {
    try {
      console.log('Bootstrap starting...', BOOT);

      // ISSUE-32: 정적 welcome-state 의 QR 영역을 부트스트랩 시점에 한 번 주입.
      // (clearViewer 경로는 자체적으로 applyQrCodeToWelcome 을 호출하므로 별도 처리 불필요.)
      applyQrCodeToWelcome();
      applyStageLaunchToWelcome();

      if (BOOT.action === 'start' && BOOT.openai_session) {
        const hasPermission = await ensurePermission();
        if (hasPermission) {
          await listMics();
          await connectOpenAIRealtime();
        }
      } else if (BOOT.action === 'stop') {
        closeConnection();
        clearViewer();
        updateWelcomeTranslationRules();
      } else {
        logStatus('대기중', '');
      }

      console.log('Bootstrap completed successfully');
    } catch (error) {
      console.error('Bootstrap error:', error);
      logStatus('초기화 실패', 'error');
      showToast(`초기화 오류: ${error.message}`, 'error');
    }
  })();

  // Cleanup
  window.addEventListener('beforeunload', () => {
    closeConnection();
  });

} catch (globalError) {
  console.error('Global script error:', globalError);
  document.getElementById('status').textContent = '스크립트 오류';
  document.getElementById('status').className = 'status-chip error';
}
</script>
