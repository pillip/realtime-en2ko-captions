<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ROOM_NAME}} — 무대 화면</title>
  <style>
    /* 무대 합성 화면 (ISSUE-40). viewer.html 의 minimal-dark 톤을 계승한다.
       레이아웃: 2열 Grid(발표 영역 / 자막 컬럼) × 좌열 3행(헤더 / 스테이지 /
       로고 바). 16:9 소스가 세로로 긴 좌열에 들어갈 때 남는 세로 공간을
       헤더 바와 로고 바가 흡수한다 — 두 바가 존재하는 이유가 그것이다. */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      /* 서버가 stage_config.caption_ratio 로부터 계산한 폭을 부트스트랩에서
         덮어쓴다. 여기 기본값은 JS 가 죽어도 Grid 가 무너지지 않게 하는
         안전망이다. 폭 문자열을 그대로 쓰지 않는 이유: 템플릿이 두 비율의
         값을 모두 갖고 있으면 응답 본문으로 룸 설정을 구분할 수 없다. */
      --caption-width: calc(100% / 4);
      /* 오퍼레이터가 행사 중에 미는 자막 배율 (ISSUE-53). SSE `control`
         이벤트가 프로그램적으로 덮어쓴다 — 이 페이지에는 조작 UI 가 없다
         (NFR-025/NFR-030). 허용 범위는 0.8–1.6.
         **하한이 1.0 미만이어도 되는 이유**: `.caption-line` 의 알파는 애초에
         large-text 완화(3:1)가 아니라 **일반 텍스트 4.5:1** 기준으로 정해졌다
         (ISSUE-40/45 — zinc-950 위 알파 0.48 = 4.84:1). 대비 판정은 글자 크기와
         무관하므로 축소가 AA 를 깨지 않는다. 이 문단이 없으면 다음 사람이
         "축소하면 대비가 위험하지 않나" 로 되돌린다. */
      --caption-scale: 1;

      /* --- 테마 토큰 (#178 · #183 · #184 · 레이어 모델 #185) ----------------
         오퍼레이터 패널이 SSE `control` 로 미는 테마를 `:root[data-theme=...]`
         가 받는다. 이 페이지에는 조작 UI 가 없다 (NFR-025/NFR-030).

         **색은 IBM Carbon Design System 에서 가져온다.** Tailwind `zinc`(#183)
         로는 **라이트가 엉성해 보였다** — 그리고 그 원인은 값이 아니라 **구조**
         였다. `zinc` 는 색 ramp 일 뿐 "면이 몇 겹인가" 를 말해 주지 않아서,
         화면 전체가 한 덩어리 회색이 됐다. 구체적으로 세 가지가 빠져 있었다:

           1) 16:9 패널과 그 바깥 레터박스 여백이 **같은 색**이라 발표 영역의
              경계가 아예 없었다 (`.presentation` 과 `.stage-frame` 이 둘 다
              `--frame`).
           2) 구분선이 전부 10% 알파라 캔버스와 **1.2:1** — 선이 있으나 안 보였다.
           3) 칩 배경도 알파라 "떠 있는 면" 이 아니라 얼룩으로 읽혔다.

         Carbon 은 색 ramp 가 아니라 **레이어 토큰 모델**(background → layer →
         border-subtle / border-strong)을 가진 시스템이고, 라이트/다크를 공식
         테마 쌍(Gray 10 / Gray 100)으로 함께 정의한다. 위 세 가지는 전부 그
         모델이 이미 답을 가진 문제다. 그래서 값만이 아니라 **역할**을 가져온다.

           gray  10 #f4f4f4 · 20 #e0e0e0 · 30 #c6c6c6 · 40 #a8a8a8
                 50 #8d8d8d · 70 #525252 · 80 #393939 · 90 #262626 · 100 #161616
           blue  70 #0043ce (라이트 포커스)   yellow 30 #f1c21b (경고)

         이 블록은 Carbon **Gray 100** 테마다: background gray-100, layer gray-90,
         border-subtle gray-80, text-primary gray-10, focus white.

         **알파 값은 눈대중이 아니다.** 각 토큰 옆 비율은 자기 배경 위에서 계산한
         WCAG 2.1 명도 대비이고 `tests/test_stage_page.py` 가 **두 테마 모두**
         검사한다. clamp() 하한이 전부 24px 미만이라 large-text 3:1 완화를 쓸 수
         없으므로 기준은 일반 텍스트 4.5:1 이다 (RL-018). 캔버스가 `#09090b` 에서
         gray-100 으로 올라가 하한이 0.46 → **0.48** 이 됐다. */
      --canvas: #161616;                         /* gray-100 — background */
      /* 구분선. **알파가 아니라 Carbon 의 border-subtle 토큰**이다 — 알파 선은
         캔버스가 바뀔 때마다 보이기도 하고 사라지기도 한다. 캔버스와 1.57:1. */
      --hairline: #393939;                       /* gray-80 */
      --ink: #f4f4f4;                            /* gray-10, 16.45:1 */
      --ink-caption: rgba(244, 244, 244, 0.5);   /*  4.90:1 (하한 0.48) */
      --ink-dim: rgba(244, 244, 244, 0.56);      /*  5.82:1 */
      --ink-muted: rgba(244, 244, 244, 0.68);    /*  8.06:1 */
      --ink-strong: rgba(244, 244, 244, 0.76);   /*  9.84:1 (칩 위 8.59:1) */
      /* Carbon 의 **레이어 두 겹**. layer-01 은 자막 컬럼(읽는 면), layer-02 는
         그 위에 뜨는 칩이다. 둘 다 **불투명**이라 글자 대비가 배경에 따라
         흔들리지 않는다. 캔버스 → 01 → 02 가 각각 1.20:1 / 1.20:1 로 한 겹씩
         올라간다 — Carbon Gray 100 의 background → layer-01 → layer-02 그대로다. */
      --layer-01: #262626;                       /* gray-90 */
      --layer-02: #393939;                       /* gray-80 */
      /* 16:9 패널 = 발표 영상이 들어가는 투사면. **순검정은 팔레트 바깥**이고
         의도적이다: 레터박스 띠가 화면에서 사라져야 하는 투사면이라 UI 색이
         아니다. 캔버스와 1.16:1 이라 구멍처럼 보이지 않는다. */
      --frame: #000000;
      /* 연결 버튼 pill. 패널 위에서 분리돼 보여야 하므로 반대쪽 명도를 쓴다 —
         어두운 패널 위에는 밝은 pill, 밝은 패널 위에는 어두운 pill.
         패널과의 분리 19.09:1 (WCAG 1.4.11 은 3:1). */
      --button-bg: #f4f4f4;
      --button-ink: #161616;                     /* 16.45:1 */
      /* 포커스 링. `outline-offset` 때문에 링의 양쪽이 모두 **패널**이므로
         대비 상대는 pill 이 아니라 패널이다. Carbon 의 다크 포커스는 흰색이고
         검정 패널 위 21.00:1 이다. */
      --focus-ring: #ffffff;
    }

    /* 라이트 — Carbon **Gray 10** 테마를 투사용으로 한 단계 아래 앵커한 것.

       Carbon 의 Gray 10 은 background 가 gray-10(#f4f4f4) 이다. 그대로 쓸 수
       없다 — 휘도 0.905 로, **눈이 아프다**고 이미 퇴짜를 맞은 값(#184)과 같은
       밝기다. 이 화면은 모니터가 아니라 행사장 프로젝터이고 캔버스와 패널이 벽을
       채운다. 그래서 역할은 그대로 두고 **단계만 한 칸씩 내린다**:

         background  gray-10 → gray-20   레터박스 여백까지 같은 면 (#185)
         layer       white   → gray-10   칩 · 밝은 로고 카드
         16:9 패널   —       → gray-30   캔버스보다 한 단계 깊은 "꺼진 화면"
         border      gray-20 → gray-40   구분선 (캔버스와 1.80:1)
         border-strong gray-50 → gray-70 패널 테두리 (패널과 4.57:1)

       **패널을 캔버스와 분리한 것이 이번 변경의 핵심이다 (#185).** 이전에는
       16:9 패널과 그 바깥 여백이 둘 다 `--frame` 이라 발표 영역이 어디서
       시작하는지 화면에 아무 단서가 없었다. 이제 여백은 캔버스, 패널은 한 단계
       깊은 면 + 실선 테두리다 — 발표자료가 붙기 전에도 "여기가 화면" 이 읽힌다.

       알파는 다크와 **공유할 수 없다.** gray-100 잉크는 순검정보다 밝고 캔버스도
       밝아 하한이 0.62 다 (다크의 자막 알파 0.50 을 복사하면 3.23:1 로 미달).
       아래 값은 전부 계산해서 4.5:1 위로 올렸고 위계(자막이 가장 흐리고 → 빈
       상태 → 종료 → 재연결 힌트 → 본문)는 다크와 같다. */
    :root[data-theme="light"] {
      --canvas: #e0e0e0;                          /* gray-20 — background */
      --hairline: #a8a8a8;                        /* gray-40 — border-subtle */
      --ink: #161616;                             /* gray-100, 13.71:1 */
      --ink-caption: rgba(22, 22, 22, 0.64);      /*  4.84:1 (하한 0.62) */
      --ink-dim: rgba(22, 22, 22, 0.7);           /*  5.83:1 */
      --ink-muted: rgba(22, 22, 22, 0.8);         /*  8.10:1 */
      --ink-strong: rgba(22, 22, 22, 0.88);       /* 10.29:1 (칩 위 11.83:1) */
      --layer-01: #f4f4f4;                        /* gray-10 */
      --layer-02: #e0e0e0;                        /* gray-20 */
      /* **16:9 는 라이트에서도 어둡다 (#186).** 이전에는 캔버스보다 한 단계만
         깊은 `gray-30` 이었는데, 화면의 2/3 를 차지하는 면이 캔버스·칩과 같은
         중간 회색 대역에 머무니 **"축 쳐진다"** 는 피드백이 나왔다. 대비는 전부
         통과했고 가독성도 좋았다 — 부족한 것은 **다이내믹 레인지**였다.

         `gray-90` 으로 내리면 캔버스와 11.46:1 이 되어 패널이 스스로 경계가
         되고(테두리가 필요 없어졌다), 화면에 어두움–중간–밝음 세 단계가 생긴다.
         그리고 이 면은 원래 **발표 영상이 들어가는 스크린**이다 — 꺼진 스크린이
         어두운 것은 은유가 아니라 사실이고, 슬라이드가 붙으면 그 위를 덮는다.
         화면이 내뿜는 빛의 총량도 함께 줄어든다.

         #180 의 "검은 구멍" 과 다른 점: 그때는 캔버스가 near-white 인데 패널만
         순검정이라 **중간 단계 없이** 튀었고 화면에 다른 어두운 요소가 하나도
         없었다. 지금은 캔버스가 중간 회색이고 로고 밴드·자막 카드가 같은 구성
         안에 있다. */
      --frame: #262626;                           /* gray-90 */
      /* pill 과 포커스 링의 대비 상대는 **패널**이고, 패널은 두 테마에서 모두
         어둡다. 그래서 이 셋은 테마를 타지 않는다 — 값이 같아도 라이트가 다크의
         토큰을 빠짐없이 덮어야 하므로(`test_both_themes_declare_every_token`)
         여기 다시 적는다. pill 13.76:1, 링 15.13:1.
         Carbon 의 라이트 포커스 blue-60 은 `gray-90` 패널 위에서 3.03:1 로
         아슬아슬하고 blue-70 은 1.94:1 로 미달이다 — 흰 링이 맞다. */
      --button-bg: #f4f4f4;
      --button-ink: #161616;
      --focus-ring: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--canvas);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      word-break: keep-all;
      line-height: 1.5;
    }

    /* --- 2열 Grid ------------------------------------------------------- */
    .stage {
      display: grid;
      grid-template-columns: 1fr var(--caption-width);
      height: 100vh;
      height: 100dvh;
      width: 100%;
      /* 연결 전에는 커서가 보여야 한다 — 연결 버튼을 눌러야 하기 때문. */
      cursor: default;
    }
    /* 캡처가 연결되면 커서를 감춘다. 커서는 프로젝터 화면의 시각적 오염이자
       "여기를 클릭할 수 있다" 는 어포던스다. 무대 창이 클릭당하는 순간 OS
       포커스가 되돌아오고 프레젠터 리모컨이 죽는다 (NFR-025). 재선택 제스처로
       컨트롤이 돌아오면 클래스가 벗겨지며 커서도 함께 복원된다 — 두 상태는
       _showControls() 한 곳에서만 바뀐다. */
    .stage.capture-live {
      cursor: none;
    }

    /* --- 좌열 3행 (헤더 / 발표 영역 / 로고 바) --------------------------- */
    .stage-main {
      display: grid;
      /* 열 트랙을 반드시 명시한다. 생략하면 암시적 트랙이 `auto`
         (= minmax(auto, max-content)) 라서 긴 행사 타이틀이나 룸 이름의
         max-content 폭만큼 트랙이 자라고, 헤더와 16:9 프레임이 자막 컬럼
         위에 그려진다. 컨테이너의 min-width: 0 은 컨테이너 박스만 제약할
         뿐 트랙을 잡지 못한다 (RL-017). */
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
    }

    .event-header {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      /* 타이틀이 비어 룸 이름으로 대체돼도 높이가 유지되어 좌열 레이아웃이
         흔들리지 않는다. RL-012: 세로 여백은 margin 이 아니라 padding. */
      min-height: 88px;
      padding: 18px 44px;
      border-bottom: 1px solid var(--hairline);
    }
    .event-title {
      margin: 0;
      font-size: clamp(20px, 1.9vw, 44px);
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- 발표 영역: 어떤 뷰포트에서도 16:9 를 유지한다 ------------------- */
    .presentation {
      display: grid;
      place-items: center;
      /* Grid 자식이 콘텐츠 최소 크기 때문에 넘치지 않게 (필수). */
      min-height: 0;
      min-width: 0;
      padding: 0;
      /* **여백은 패널이 아니라 페이지다 (#185).** 예전에는 여기도 `--frame`
         이라 16:9 패널과 그 바깥이 한 덩어리였고, 발표 영역이 어디서 시작하는지
         화면에 단서가 없었다 — 라이트에서 "엉성하다" 는 인상의 가장 큰 원인이다.
         다크에서는 캔버스와 패널이 1.16:1 이라 이 분리가 거의 안 보이는데,
         그게 맞다: 어두운 방에서 투사면 경계는 드러나면 안 된다. */
      background: var(--canvas);
      container-type: size;
    }
    .stage-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      /* 컨테이너 높이가 제약일 때 폭을 줄여 비율을 지킨다. cqh 미지원
         브라우저는 위의 width: 100% + max-height 로 degrade 한다
         (RL-011 의 vh/dvh 페어링과 같은 점진적 향상 패턴). */
      width: min(100%, calc(100cqh * 16 / 9));
      overflow: hidden;
      /* 테두리를 두지 않는다. 라이트에서 패널은 캔버스와 11.46:1 이라 **스스로
         경계**이고, 다크에서는 경계가 보이면 안 된다 (#186). 예전에는 패널이
         캔버스와 1.29:1 뿐이라 선을 그어야 했다. */
      background: var(--frame);
    }

    /* 캡처 스트림은 ISSUE-42 가 연결한다. 16:9 가 아닌 소스도 잘리거나
       늘어나지 않도록 contain 으로 레터박스 처리한다. */
    .capture-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--frame);
    }
    .capture-video[hidden] { display: none; }

    /* --- 캡처 컨트롤 / 상태 배너 (ISSUE-42) ------------------------------ */
    /* 무대 화면의 클릭 표면은 여기 하나뿐이고, 연결되면 렌더 트리에서 통째로
       빠진다. `pointer-events: none` 으로 죽이는 것만으로는 부족하다 — 그것은
       문서 안의 히트테스트만 바꿀 뿐, OS 가 그 창에 포커스를 주는 것 자체는
       막지 못한다 (NFR-025). */
    .capture-controls {
      position: absolute;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 82%;
      text-align: center;
    }

       24px 미만이므로 large-text 3:1 완화에 기대지 않고 본문 기준 4.5:1 을

      font-size: clamp(15px, 1vw, 22px);
      font-weight: 600;
      letter-spacing: -0.01em;

      background: var(--button-bg);
      border: 0;
      border-radius: 999px;
      padding: 12px 26px;
      cursor: pointer;

      outline-offset: 3px;
    }

       더블클릭으로 재선택 컨트롤을 되부른 뒤 소스 선택을 취소하면,

    .capture-hint {

      max-width: 100%;
      padding: 10px 20px;
      border-radius: 999px;
      background: #161616;
      border: 1px solid #6f6f6f;
      font-size: clamp(13px, 0.9vw, 20px);
      line-height: 1.5;

       rgba(253,230,138,0.95) = 14.41:1, 테두리는 칩 배경과 3.11:1 (비텍스트

       21.12px, 1280px 에서 15px — 상한 24px 에 닿지 않으므로 본문 기준
       4.5:1 을 적용했다 (RL-018). */

      position: absolute;
      left: 50%;
      bottom: 18%;

      border-radius: 999px;

      border: 1px solid #6f6f6f;

    .debug-overlay {

      display: none;
    }

    // -----------------------------------------------------------------------
    const CONFIG = {
      room_id: {{ROOM_ID}},
      output_langs: {{OUTPUT_LANGS_JSON}},
      caption_lang: {{PRIMARY_LANG}},
      // 서버가 `?lang=` 을 받았고 그 값을 채택했는가 (ISSUE-53). 브라우저는
      // 이것을 스스로 알 수 없다 — 쿼리를 여기서 다시 파싱하면 서버가 거부한
      // 코드가 되살아난다. true 면 이 화면은 자기 언어를 명시적으로 고른
      // 것이므로 룸 단위 `control` 이 언어를 바꾸지 못한다.
      lang_pinned: {{LANG_PINNED}},

      stage: {{STAGE_CONFIG_JSON}},

    // 없는 에셋은 해당 이미지만 제거해 로고 바 레이아웃을 지킨다 (RL-008).
    // 다만 그룹의 마지막 이미지가 죽으면 라벨만 떠 있는 빈 그룹이 되고,
    // 그런 그룹만 남으면 76px 바가 글자만으로 채워진다 — 스크린리더에도
    // "주최" 만 읽히고 아무것도 없는 상태다. 그래서 비어버린 그룹과, 그룹이
    // 하나도 남지 않은 바까지 함께 접는다.
    // /branding 라우트는 ISSUE-38 이 제공한다 — 아직 없으면 전부 404 다.
    function dropBrokenLogo(img) {
      const group = img.closest(".logo-group");
      img.remove();
      if (group && !group.querySelector("img")) group.remove();
      const bar = document.getElementById("logo-bar");
      if (bar && !bar.querySelector(".logo-group")) bar.hidden = true;
    }

    function makeLogoImage(filename, alt) {
      const img = document.createElement("img");
      img.alt = alt; // RL-010: 그룹 라벨에서 파생, 반복 표시는 alt=""
      img.decoding = "async";
      img.addEventListener("error", function () { dropBrokenLogo(img); });

      img.src = "/branding/" + encodeURIComponent(CONFIG.room_id) +
                "/" + encodeURIComponent(filename);
      return img;
    }

    // -----------------------------------------------------------------------
    // 자막 컬럼 (ISSUE-41) — viewer.html 의 SSE 구독 + 타자기 스무딩을 무대용
    // 으로 이식한다. viewer 와 다른 점 두 가지:
    //  (1) 타이머가 28ms 인터벌이 아니라 requestAnimationFrame 이다. 무대
    //      페이지는 캡처 <video>(ISSUE-42)의 프레임 렌더와 메인 스레드를
    //      공유하므로, 렌더 스케줄과 무관하게 깨어나는 타이머를 쓰면 영상이
    //      버벅인다 (NFR-025).
    //  (2) 이 화면에는 조작자가 없으므로 사용자 스크롤 감지 분기가 없다 —
    //      항상 하단 고정이고 되돌리기 어포던스도 두지 않는다.
    // -----------------------------------------------------------------------
    const MAX_LINES = 60; // 좁은 컬럼 DOM 상한 (viewer 는 200)
    const MAX_REVEAL_PER_FRAME = 24; // 큰 청크가 한 프레임을 통째로 잡지 않도록
    // 서버(`websocket_handler.CAPTION_SCALE_MIN/MAX`)와 같은 범위. 서버가 이미
    // 검증하지만 클라이언트도 자기 범위로 판정한다 — 어떤 이유로든 범위 밖
    // 값이 도달했을 때 레이아웃이 깨지지 않아야 한다.
    const CAPTION_SCALE_MIN = 0.8;
    const CAPTION_SCALE_MAX = 1.6;
    const WAITING_MSG = {
      ko: "잠시 후 시작됩니다",
      en: "Starting shortly",
      zh: "即将开始",
      vi: "Sắp bắt đầu",
    };

    let captionLive = null;
    let captionEnded = null;

    let container = null;
    let announcer = null;
    let connError = null;

    // 지금 구독 중인 언어. `CONFIG.caption_lang` 을 가변 상태로 재활용하지
    // 않는다 — 부트스트랩 값은 "서버가 무엇을 줬는가" 의 기록으로 남아야
    // `lang_pinned` 판정과 디버깅의 근거가 된다 (ISSUE-53).
    let currentLang = CONFIG.caption_lang;
    let captionState = "waiting"; // 'waiting' | 'active' | 'ended'
    // 종료는 최종 상태다. currentLine 만 비우면 나머지 진입점(message)이 살아
    // 있어서, 닫힌 소켓에서 늦게 도착한 프레임 하나가 종료된 컬럼을 되살린다.
    // 도달 가능성은 필드가 아니라 진입점의 성질이므로 플래그로 막는다.
    let sessionEnded = false;
    let currentLine = null; // 진행 중인 .caption-line (라인 사이에는 null)
    let twTarget = ""; // 드러내야 할 최종 텍스트
    let twShown = 0; // 지금까지 화면에 나온 글자 수
    let twFinalize = false; // 따라잡으면 라인을 확정할 것인가
    let twRaf = 0; // rAF 핸들 (0 = 정지)

    // 항상 하단 고정. 실제로 글자가 늘어난 프레임에서만 호출한다 — 강제 레이아웃을
    // 유발하는 것은 scrollTop 쓰기가 아니라 그 앞의 scrollHeight **읽기** 이므로
    // (직전 textContent 쓰기가 더럽힌 레이아웃을 동기 flush 한다), 호출 자체를
    // 아끼는 것이 요점이고 값 비교는 불필요한 스크롤 앵커 갱신만 막는다.
    function _scrollToBottom() {
      if (!scroller) return;
      const max = scroller.scrollHeight - scroller.clientHeight;
      if (max > 0 && scroller.scrollTop !== max) scroller.scrollTop = max;
    }

    function _twStop() {
      if (twRaf) {
        cancelAnimationFrame(twRaf);
        twRaf = 0;
      }
    }

    // 라이브 리전에 쓰는 **유일한** 경로 (RL-019). 애니메이션 노드는
    // aria-hidden 이므로, 확정된 라인만 여기로 흘려보내야 스크린리더가
    // 프레임마다 텍스트로 범람하지 않는다.
    function announce(text) {
      if (announcer) announcer.textContent = text;
    }

    // 라인 확정 — slice 결과가 아니라 목표 텍스트 자체를 넣는다. 번역 후처리가
    // 문자열을 **줄이는** 경우가 있어 마지막 슬라이스가 최종본이 아닐 수 있다.
    function _lockLine() {
      if (!currentLine) return;
      currentLine.textContent = twTarget;
      announce(twTarget);
      currentLine = null;
      _twStop();
      _scrollToBottom();
    }

    function _twStep() {
      twRaf = 0;
      if (!currentLine) return;
      if (twShown > twTarget.length) {
        // 목표가 줄어들었다(번역 후처리가 문자열을 깎는 경우). 클램프만 하면
        // gap 이 0 이 되어 아래 쓰기 분기를 건너뛰고, 화면에는 더 긴 옛 문자열이
        // 그대로 남는다 — 줄어든 목표에 화면을 맞춘다.
        twShown = twTarget.length;
        currentLine.textContent = twTarget;
      }
      const gap = twTarget.length - twShown;
      if (gap > 0) {
        const step = Math.min(MAX_REVEAL_PER_FRAME, Math.max(2, Math.ceil(gap / 6)));
        twShown = Math.min(twTarget.length, twShown + step);
        currentLine.textContent = twTarget.slice(0, twShown);
        _scrollToBottom(); // 실제로 글자가 늘어난 프레임에서만 만진다
      }
      if (twShown >= twTarget.length) {
        // 따라잡았다. 최종 청크였으면 확정하고, 부분 청크였으면 다음 청크가
        // 올 때까지 루프를 쉰다 (idle 중 rAF 를 태우지 않는다).
        if (twFinalize) _lockLine();
        return;
      }
      twRaf = requestAnimationFrame(_twStep);
    }

    function _twStart() {
      if (twRaf || !currentLine) return;
      twRaf = requestAnimationFrame(_twStep);
    }

    function _ensureCurrentLine() {
      if (currentLine) return;
      const empty = document.getElementById("caption-empty");
      if (empty && empty.parentNode) empty.remove();
      const div = document.createElement("div");
      div.className = "caption-line";
      container.appendChild(div);
      // firstChild 가 아니라 firstElementChild — 상한은 요소 수로 세는데
      // firstChild 는 템플릿 들여쓰기가 남긴 공백 **텍스트 노드**부터 지운다.
      // 지금은 여분 반복으로 자가 교정되지만, 주석 하나만 들어와도 깨진다.
      while (container.children.length > MAX_LINES) {
        container.removeChild(container.firstElementChild);
      }
      currentLine = div;
      twTarget = "";
      twShown = 0;
      twFinalize = false;
    }

    // 부분(스트리밍) 청크 — 목표만 키우고 라인은 확정하지 않는다.
    function updatePartialCaption(text) {
      if (!text) return;
      _ensureCurrentLine();
      twTarget = text;
      _twStart();
    }

    // 최종 메시지 — 남은 글자를 마저 드러낸 뒤 라인을 확정한다.
    function finalizeCaption(text) {
      // 앞 라인이 아직 확정 대기 중인데 다음 final 이 도착하면 즉시 스냅해
      // 확정하고 새 라인을 연다 — SSE 가 몰아쳐도 라인이 합쳐지거나 유실되지
      // 않는다. viewer.html:495 에는 이 분기가 없어 연속 final 이 한 줄로
      // 합쳐진다 (여기서는 그 동작을 의도적으로 바꾼다).
      if (currentLine && twFinalize) _lockLine();
      // 빈 final 은 화면에 넣을 것이 없다. 진행 중인 라인이 있으면 그 라인을
      // 확정하라는 신호로 쓰고, 없으면 그냥 무시한다. 그대로 통과시키면
      // _ensureCurrentLine() 이 대기 문구(#caption-empty)를 지우고 빈
      // .caption-line 을 여는데, 빈 final 이 이어지면 무대 화면이 되돌릴 수
      // 없는 빈 컬럼이 된다 (broadcast 경로에 비어있음 가드가 없다).
      const next = text || (currentLine ? twTarget : "");
      if (!next) return;
      _ensureCurrentLine();
      twTarget = next;
      twFinalize = true;
      _twStart();
    }

    // 숨김 탭에서는 rAF 가 멈춘다. 남은 글자를 즉시 스냅해 두지 않으면 복귀
    // 순간 수백 자가 한꺼번에 몰아친다.
    // NFR-025: 이 페이지가 등록하는 유일한 document 레벨 리스너다. keydown 은
    // 여기에도, 다른 어디에도 없다 — 유일한 예외가 `?debug=1` 리허설 계수기이며
    // 그것은 setupDebugOverlay() 안에서만 등록된다. 키 이벤트는 프레젠터
    // 리모컨의 것이므로 끝까지 건드리지 않는다.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        _twStop();
        if (currentLine) {
          twShown = twTarget.length;
          currentLine.textContent = twTarget;
          _scrollToBottom();
          if (twFinalize) _lockLine();
        }
      } else {
        _twStart();
        // NFR-027: 화면이 숨겨지는 동안 브라우저가 wake lock 을 자동 해제한다.
        // 돌아오면 다시 요청한다 — 리스너를 새로 달지 않고 이미 있는 이
        // 분기를 확장하는 것이 요점이다 (RL-009).
        if (document.visibilityState === "visible") requestWakeLock();

    });

    // -----------------------------------------------------------------------
    // 발표자료 화면 캡처 (ISSUE-42) — FR-074 / FR-075 / FR-081, NFR-025..027
    //
    // 이 블록의 설계 원칙은 하나다: **무대 창이 OS 포커스를 쥐지 않는다.**
    // 브라우저는 다른 앱에 키를 주입할 수 없으므로, 기본 동작 취소를
    // 생략한다고 해서 방향키가 PowerPoint 로 전달되지는 않는다. 실제 요구사항은
    // 발표가 진행되는 동안 이 창이 포커스를 갖지 않는 것이고, 그래서 포커스를
    // 얻는 경로를 전부 없앤다 — 연결 후 보이는 클릭 표면 0개, `cursor: none`,
    // `surfaceSwitching: "exclude"`, 포커스/전체화면 API 자동 호출 금지,
    // 그리고 캡처 시작 직후의 `document.activeElement?.blur()`.
    // keydown 리스너 부재는 그 전제가 깨졌을 때를 위한 2차 방어선이다.
    // -----------------------------------------------------------------------
    const CAPTURE_CONSTRAINTS = {
      // 30fps 는 발표자료(정적 슬라이드)에 충분하고, 60fps 를 요구해 인코더와
      // 메인 스레드를 자막 애니메이션과 경쟁시키지 않는다 (NFR-025).
      video: { frameRate: { ideal: 30 } },
      audio: false,
      // 무한 거울 방지. Chromium 계열만 보장하므로 _detectSelfCapture() 가
      // 휴리스틱으로 뒤를 받친다.
      selfBrowserSurface: "exclude",
      // Chrome 의 "다른 탭 공유" 전환 위젯은 무대 화면 위에 클릭 표면을 하나
      // 더 얹는다. 소스 변경은 우리 재선택 경로로만 처리한다 (NFR-025).
      surfaceSwitching: "exclude",
      systemAudio: "exclude",
    };

    const HANDOFF_MS = 8000; // 안내가 무대에 영구히 남지 않도록 하는 상한
    const CONNECT_LABEL = "발표자료 연결";
    const RECONNECT_LABEL = "발표자료 다시 연결";
    // RL-006: 화면에 나가는 문구는 이 파일 안의 상수뿐이다. 무대 화면은 곧
    // 관객 화면이므로 예외 메시지·이름·스택은 어떤 경로로도 DOM 에 닿지 않는다.
    const CAPTURE_FAIL_MSG =
      "발표자료 화면을 가져오지 못했습니다. 다시 연결을 눌러 창을 선택하세요";
    const CAPTURE_UNSUPPORTED_MSG =
      "이 브라우저는 발표자료 화면 공유를 지원하지 않습니다. Chrome 또는 Edge 최신 버전을 사용하세요";

    let stageRoot = null;
    let captureVideo = null;
    let captureControls = null;
    let connectButton = null;
    let captureHint = null;
    let captureWarning = null;
    let handoffPrompt = null;
    let debugFocus = null;

    let captureTrack = null;
    let captureStarted = false; // 한 번이라도 연결된 적이 있는가 (버튼 문구용)
    let handoffTimer = 0;
    let wakeLockSentinel = null;

    // 컨트롤 가시성과 커서를 **한 곳에서만** 뒤집는다. 두 상태가 어긋나면
    // 커서만 사라진 채 버튼이 남아 클릭 표면이 그대로 살아 있게 된다.
    // `display: none` 인 이유는 `pointer-events: none` 이 문서 안의 히트테스트만
    // 바꿀 뿐 OS 가 그 창에 포커스를 주는 것 자체는 막지 못하기 때문이다.
    function _showControls(show) {

      if (stageRoot) stageRoot.classList.toggle("capture-live", !show);
    }

    function _setCaptureError(message) {
      if (!captureHint) return;
      captureHint.textContent = message;
      captureHint.hidden = !message;
    }

    function _showHandoff() {
      if (!handoffPrompt) return;
      handoffPrompt.hidden = false;
      if (handoffTimer) clearTimeout(handoffTimer);
      handoffTimer = setTimeout(_hideHandoff, HANDOFF_MS);
    }

    function _hideHandoff() {
      if (handoffTimer) {
        clearTimeout(handoffTimer);
        handoffTimer = 0;
      }
      if (handoffPrompt) handoffPrompt.hidden = true;
    }

    function _updateDebugFocus() {
      if (!debugFocus) return;
      debugFocus.textContent =
        document.hasFocus() ? "이 창 포커스 있음" : "이 창 포커스 없음";
    }

    // 창이 포커스를 잃었다는 것은 사용자가 발표 앱으로 넘어갔다는 뜻 —
    // 핸드오프가 성공한 신호이므로 안내를 그 즉시 거둔다.
    function onWindowBlur() {
      _hideHandoff();
      _updateDebugFocus();
    }

    function onWindowFocus() {
      _updateDebugFocus();
    }

    // 옛 트랙의 리스너를 **먼저** 떼고 나서 멈춘다. 순서를 바꾸면 재선택 때
    // 옛 트랙의 정리가 방금 붙인 새 캡처를 도로 철거한다 (RL-009).
    function _releaseCapture() {
      if (!captureTrack) return;
      captureTrack.removeEventListener("ended", onCaptureEnded);
      try {
        captureTrack.stop();
      } catch (e) {
        /* 이미 끝난 트랙 — 무해하다 */
      }
      captureTrack = null;
    }

    // FR-075: 검은 화면 대신 타이틀 카드로 되돌아가고 재연결 경로를 연다.
    // 우측 자막 컬럼은 이 함수가 전혀 건드리지 않는다 — 발표 영역의 사고가
    // 자막을 끊으면 안 된다.
    function onCaptureEnded() {
      _releaseCapture();
      captureVideo.srcObject = null;
      captureVideo.hidden = true;
      captureWarning.hidden = true;
      _hideHandoff();
      _setCaptureError("");
      connectButton.textContent = RECONNECT_LABEL;
      _showControls(true);
      _releaseWakeLock();
    }

    // FR-081: `selfBrowserSurface` 를 무시하는 브라우저(Safari 등)를 위한 폴백.
    // `displaySurface` 만 보면 정상적인 다른 탭 공유까지 전부 경고가 뜨므로,
    // 캡처 해상도가 이 창의 크기와 겹치는지까지 함께 본다.
    function _detectSelfCapture(track) {
      const s = (track.getSettings && track.getSettings()) || {};
      if (s.displaySurface !== "browser") return false;
      const dpr = window.devicePixelRatio || 1;
      const near = function (got, want) {
        return got > 0 && Math.abs(got - want) <= Math.max(8, want * 0.05);
      };
      return near(s.width, Math.round(window.innerWidth * dpr)) &&
             near(s.height, Math.round(window.innerHeight * dpr));
    }

    // NFR-027 / RL-008: 미지원 브라우저에서 예외 없이 degrade 한다.
    // 살아 있는 트랙(`captureTrack`)이 조건이지 "한 번이라도 연결했는가"
    // (`captureStarted`)가 아니다 — 트랙이 끝난 뒤 탭을 오갔다고 해서 아무것도
    // 표시하지 않는 화면을 계속 깨워 둘 이유는 없다.
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      if (!captureTrack || wakeLockSentinel) return;
      try {
        wakeLockSentinel = await navigator.wakeLock.request("screen");
        wakeLockSentinel.addEventListener("release", function () {
          wakeLockSentinel = null;
        });
      } catch (e) {
        wakeLockSentinel = null; // 거부도 정상 경로다 — 조용히 넘어간다
      }
    }

    function _releaseWakeLock() {
      if (!wakeLockSentinel) return;
      try {
        wakeLockSentinel.release();
      } catch (e) {
        /* noop */
      }
      wakeLockSentinel = null;
    }

    async function startCapture() {
      // RL-008: 비보안 컨텍스트에서는 navigator.mediaDevices 자체가 없다.
      const md = navigator.mediaDevices;
      if (!md || typeof md.getDisplayMedia !== "function") {
        _setCaptureError(CAPTURE_UNSUPPORTED_MSG);
        return;
      }
      let stream = null;
      try {
        stream = await md.getDisplayMedia(CAPTURE_CONSTRAINTS);
      } catch (e) {
        // 사용자가 다이얼로그를 취소한 경우를 포함한 모든 거부. 예외의
        // 메시지와 이름은 내부 경로나 정책 이름을 담고 있으므로 DOM 에
        // 옮기지 않는다 — 무대 화면은 곧 관객 화면이다 (RL-006).
        _setCaptureError(CAPTURE_FAIL_MSG);
        return;
      }
      _setCaptureError("");
      _releaseCapture();

      const track = stream.getVideoTracks()[0];
      captureTrack = track || null;
      if (track) track.addEventListener("ended", onCaptureEnded);

      captureVideo.srcObject = stream;
      captureVideo.hidden = false;
      captureStarted = true;
      connectButton.textContent = RECONNECT_LABEL;

      // 자기 캡처는 경고만 하고 캡처를 강제로 끊지 않는다 (FR-081). 경고가 뜬
      // 동안에는 재선택 컨트롤을 남겨 둔다 — 그것이 곧 재선택 액션이다.
      const mirrored = track ? _detectSelfCapture(track) : false;
      captureWarning.hidden = !mirrored;
      _showControls(mirrored);

      // 권한 다이얼로그를 브라우저에서 조작했으므로 이 순간 포커스는 반드시
      // 이 창에 있다. 그대로 발표를 시작하면 첫 슬라이드부터 넘어가지 않는다.
      document.activeElement?.blur();
      _showHandoff();
      requestWakeLock();
    }

    // 리허설 진단 오버레이. 쿼리 플래그가 없으면 DOM 도 리스너도 만들지 않는다 —
    // 본 행사 화면에는 이 경로 자체가 존재하지 않는다. 판정 기준은
    // "발표 앱이 포커스를 쥔 상태에서 리모컨 20회 → 카운터 0" 이다.
    function setupDebugOverlay() {
      if (new URLSearchParams(location.search).get("debug") !== "1") return;
      const box = document.createElement("div");
      box.className = "debug-overlay";
      box.id = "debug-overlay";

      debugFocus = document.createElement("div");
      debugFocus.id = "debug-focus";

      const keys = document.createElement("div");
      keys.textContent = "keydown ";
      const counter = document.createElement("span");
      counter.id = "debug-key-count";
      counter.textContent = "0";
      keys.appendChild(counter);

      box.appendChild(debugFocus);
      box.appendChild(keys);
      document.body.appendChild(box);
      _updateDebugFocus();

      // 이 페이지 전체에서 유일한 keydown 등록이다. `{ passive: true }` 로
      // 브라우저에 "절대 취소하지 않는다" 고 미리 약속하고, 실제로 세기만 한다.
      // 카운터가 올라간다는 것은 무대 창이 포커스를 쥐고 있다는 뜻이며 세팅이
      // 잘못된 것이다 — 그 사실을 알려 주는 것이 이 오버레이의 목적이다.
      let seen = 0;
      document.addEventListener("keydown", function () {
        seen += 1;
        counter.textContent = String(seen);
      }, { passive: true });
    }

    function showError(visible) {
      if (connError) connError.classList.toggle("visible", !!visible);
    }

    function waitingText(lang) {
      return WAITING_MSG[lang] || WAITING_MSG.ko;
    }

    // 상태 전환은 자막 컬럼 안에서만 일어난다 — 좌열(#event-header /
    // #presentation / #stage-frame / #logo-bar)은 건드리지 않는다.
    function setCaptionState(name) {
      captionState = name;
      const ended = name === "ended";
      if (captionLive) captionLive.hidden = ended;
      if (captionEnded) captionEnded.hidden = !ended;
      if (ended) showError(false); // 종료된 세션에 재연결 힌트는 거짓말이다
      // 대기 문구(#caption-empty)는 aria-hidden 인 자막 스택 **안**에 있어
      // 스크린리더에 닿지 않는다 (viewer.html 은 waiting 을 별도 섹션으로 두어
      // 공짜로 얻는 접근성인데, 여기서는 한 서브트리로 합쳐지면서 잃었다).
      // 그래서 대기 상태에서는 announcer 가 그 문구를 대신 들고, 자막이 흐르기
      // 시작하거나 세션이 끝나면 비운다. 자막 **텍스트**를 쓰는 경로는 여전히
      // _lockLine() 하나뿐이다 (RL-019). 종료 문구는 #caption-ended 가
      // role="status" 로 직접 알리므로 여기서 되풀이하지 않는다 — 이중 낭독이 된다.
      announce(name === "waiting" ? waitingText(currentLang) : "");
    }

    function applyWaitingText(lang) {
      const empty = document.getElementById("caption-empty");
      if (empty) empty.textContent = waitingText(lang);
    }

    // 자막 배율 적용 (ISSUE-53). SSE 로 값만 도착하고 **프로그램적으로만**
    // 반영된다 — 무대 화면에는 조작 표면이 0개다 (NFR-025/NFR-030).
    function applyCaptionScale(value) {
      // 비수치는 클램프가 아니라 무시한다: Number("크게") 는 NaN 이고, NaN 을
      // 클램프하면 NaN 이 CSS 로 들어가 규칙 전체가 무효가 된다.
      if (typeof value !== "number" || !isFinite(value)) return;
      const clamped = Math.min(CAPTION_SCALE_MAX, Math.max(CAPTION_SCALE_MIN, value));
      const root = document.documentElement;
      const next = String(clamped);
      if (root.style.getPropertyValue("--caption-scale") === next) return;
      root.style.setProperty("--caption-scale", next);
      // 배율은 쌓여 있는 모든 라인의 높이를 바꾸므로 크레딧 롤의 바닥 위치가
      // 통째로 움직인다. 무대에는 잴 사용자 스크롤 상태가 없으므로
      // (test_no_user_scroll_override_controls) 조건 없이 다시 바닥에 붙인다 —
      // 다음 자막이 올 때까지 최근 줄이 화면 밖에 머무르지 않게 한다.
      _scrollToBottom();
    }

    function closeStream() {
      if (!es) return;
      try { es.close(); } catch (e) { /* noop */ }
      es = null;
    }

    // 언어 재구독. 순서가 계약이다 (ISSUE-53 Implementation Notes):
    //   ② 스크롤 추종 측정 — 무대에는 조작자가 없어 잴 사용자 상태가 없다.
    //      viewer.html 의 사용자 스크롤 감지 분기를 이식하지 않는 이유이며,
    //      test_no_user_scroll_override_controls 가 그것을 못 박고 있다.
    //   ③ 타자기를 먼저 멈춘다 — ⑤ 보다 앞서야 rAF 콜백이 방금 지운 노드에
    //      쓰지 않는다.
    //   ④ 핸들 하나가 아니라 상태 튜플 전체를 초기화한다 (RL-022).
    //   ⑤ replaceChildren() 으로 스택을 비우고 **새 언어**의 대기 문구를 만든다.
    //   ⑥⑦ 옛 스트림을 닫고 새 스트림을 연다 — 그 순서는 아래 구독 함수가 쥔다.
    function resubscribe(next) {
      _twStop();
      currentLine = null;
      twTarget = "";
      twShown = 0;
      twFinalize = false;
      currentLang = next;
      if (container) {
        container.replaceChildren();
        const empty = document.createElement("div");
        empty.id = "caption-empty";
        empty.className = "caption-empty";
        empty.textContent = waitingText(next);
        container.appendChild(empty);
      }
      // announce() 를 여기서 부르지 않는다 — 대기 문구 낭독은 setCaptionState()
      // 가 이미 소유하고 있고, 쓰기 경로가 둘이 되면 RL-019 로 되돌아간다.
      setCaptionState("waiting");
      connect(next);
    }

    // 룸 기본 언어가 바뀌었다는 통지. **명시적으로 언어를 고른 화면은 절대
    // 끌려가지 않는다** — 그것이 이 규칙의 존재 이유다.
    function applyPrimaryLang(next) {
      if (CONFIG.lang_pinned) return; // ?lang= 을 서버가 채택한 화면
      if (typeof next !== "string" || !next) return;
      if (next === currentLang) return; // 중복 통지는 무동작 (자막이 안 끊긴다)
      const langs = Array.isArray(CONFIG.output_langs) ? CONFIG.output_langs : [];
      if (!langs.includes(next)) return; // 서버가 막지만 여기서도 판정한다
      resubscribe(next);
    }

    // 허용 테마 — 서버(`websocket_handler.STAGE_THEMES`)와 같은 목록이다.
    // 모르는 값은 무시한다: 테마를 지어내면 토큰이 없는 상태가 되어 화면이
    // 통째로 깨진다.
    const STAGE_THEMES = ["dark", "light"];

    // 로고 바 배경 톤 — 서버(`stage_config.LOGO_BAR_TONES`)와 같은 목록이다.
    const LOGO_BAR_TONES = ["auto", "light", "dark"];

    function applyLogoBarTone(value) {
      if (LOGO_BAR_TONES.indexOf(value) === -1) return;
      const bar = document.getElementById("logo-bar");
      if (!bar) return;
      // `auto` 는 속성을 **지운다** — 기본 `.logo-bar` 규칙이 곧 auto 이고,
      // 속성을 달면 같은 값이 두 곳에 살게 된다 (테마의 data-theme 과 같은 이유).
      if (value === "auto") bar.removeAttribute("data-tone");
      else bar.dataset.tone = value;
    }

    function applyStageTheme(value) {
      if (STAGE_THEMES.indexOf(value) === -1) return;
      const root = document.documentElement;
      // 기본(다크)은 속성을 **지운다**. `data-theme="dark"` 를 써 두면 다크
      // 토큰이 `:root` 와 `:root[data-theme]` 두 곳에 살게 되고, 둘이 갈라지는
      // 날 어느 쪽이 쓰이는지 아무도 모른다.
      if (value === "dark") root.removeAttribute("data-theme");
      else root.setAttribute("data-theme", value);
    }

    // 발표자료 캡처 해제. 오퍼레이터 패널의 control 명령과 F10 이 **같은 함수**로
    // 들어온다 — 두 경로가 갈라지면 한쪽만 고쳐지는 날이 온다.
    function disconnectPresentation() {
      // 조건은 **살아 있는 트랙**이다. `captureStarted` 는 "한 번이라도
      // 연결했는가" 이고 재선택 코너 제스처가 그 값을 쓴다 — 여기서 꺼 버리면
      // 해제 후 재선택이 죽는다 (requestWakeLock 의 같은 주석 참고).
      if (!captureTrack) return; // 연결돼 있지 않으면 아무 일도 없다 (멱등)
      onCaptureEnded(); // 트랙 정리 + 영상 숨김 + 재연결 경로 복원
    }

    function handleControl(payload) {
      if (sessionEnded) return; // 끝난 세션은 어떤 통지로도 되살아나지 않는다
      if (!payload) return;
      applyCaptionScale(payload.caption_scale);
      applyStageTheme(payload.theme);
      applyLogoBarTone(payload.logo_bar_tone);
      applyPrimaryLang(payload.primary_lang);
      // 일회성 명령. 서버가 control **상태**에 저장하지 않으므로 재접속한
      // 화면이 지난 명령을 다시 받는 일은 없다
      // (`websocket_handler._publish_control_command`).
      if (payload.presentation === "disconnect") disconnectPresentation();
    }

    // 초기 구독 언어는 서버가 ?lang= 을 검증해 내려준 CONFIG.caption_lang 이다.
    // 브라우저에서 쿼리를 다시 파싱하면 서버가 거부한 코드가 되살아난다
    // (무대 화면에는 언어 전환 UI 도 없다 — NFR-025). 그 뒤의 구독 변경은
    // 오직 `control` 이벤트가 정한다.
    function connect(lang) {
      closeStream(); // 두 스트림이 한 컬럼에 섞이지 않도록 **먼저** 닫는다
      const url = "/stream/" + encodeURIComponent(CONFIG.room_id) +
                  "?lang=" + encodeURIComponent(lang);
      try {
        es = new EventSource(url);
      } catch (e) {
        // 생성자는 잘못된 URL 에서만 동기적으로 던진다. 무대에는 재시도할
        // 사람이 없으므로 배너만 남기고 조용히 포기한다 (RL-006).
        showError(true);
        return;
      }

      es.addEventListener("open", function () { showError(false); });

      es.addEventListener("message", function (ev) {
        if (sessionEnded) return; // 종료 후 늦게 도착한 프레임은 버린다
        showError(false);
        let payload = null;
        try {
          payload = JSON.parse(ev.data);
        } catch (e) {
          return; // 깨진 프레임은 무시 — 파싱 오류를 화면에 옮기지 않는다 (RL-006)
        }
        if (!payload || typeof payload.text !== "string") return;
        if (captionState !== "active") setCaptionState("active");
        if (payload.partial) {
          updatePartialCaption(payload.text);
        } else {
          finalizeCaption(payload.text);
        }
      });

      // 룸 단위 프레젠테이션 상태 (ISSUE-53). 자막과 **별도 리스너**다 —
      // message 안에서 분기하면 SSE named event 를 쓰는 의미가 없고 자막
      // 경로에 조건문이 하나 늘어난다.
      es.addEventListener("control", function (ev) {
        let payload = null;
        try {
          payload = JSON.parse(ev.data);
        } catch (e) {
          return; // 깨진 프레임은 무시 (RL-006)
        }
        handleControl(payload);
      });

      es.addEventListener("session_end", function () {
        sessionEnded = true;
        _twStop();
        currentLine = null;
        setCaptionState("ended");
        closeStream();
      });

      // EventSource 는 스스로 재연결한다 — 일시적 힌트만 띄운다.
      es.addEventListener("error", function () { showError(true); });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const $ = (id) => document.getElementById(id);
      const cfg = CONFIG.stage || {};

      // 서버가 렌더한 룸 이름(엔티티 디코딩 완료)이 타이틀 미설정 시 폴백이다.
      const headerTitle = $("event-title");
      const title = cfg.event_title || headerTitle.textContent.trim();
      headerTitle.textContent = title;

      const logoBar = $("logo-bar");
      // 룸 기본값을 적용한다. 행사 중 오퍼레이터가 보내는 control 은 같은 함수로
      // 들어와 이 값을 덮어쓴다 — 두 경로가 갈라지면 한쪽만 고쳐진다 (#182).
      applyLogoBarTone(cfg.logo_bar_tone);
      const groups = Array.isArray(cfg.logo_groups) ? cfg.logo_groups : [];
      // `!== false` 로 읽는다 — 키가 없는(이 옵션 도입 이전) 설정은 종전처럼
      // 라벨이 보여야 한다. `Boolean(cfg.show_logo_labels)` 로 쓰면 키 부재가
      // "끄기" 가 되어 기존 무대 화면이 말없이 바뀐다.
      const showLogoLabels = cfg.show_logo_labels !== false;
      let shown = 0;
      groups.forEach(function (group) {
        const assets = Array.isArray(group && group.assets) ? group.assets : [];
        if (assets.length === 0) return; // 자산 없는 그룹은 숨긴다
        // 화면에 쓰는 것은 **표시 글자(`title`)** 다. `label` 은 서버가 그룹을
        // 식별하는 키이고 화면에 나가지 않는다 — 관리자가 라벨을 "Host" 로
        // 바꿔도 키는 "주최" 로 남아 업로드된 로고가 그 그룹에 유지된다.
        // `title` 이 비면 서버 정규화가 이미 키로 채워 보내므로 여기서 다시
        // 폴백하지 않는다(폴백 정의는 `stage_config._as_group_title` 하나다).
        const label = String(
          (group && (group.title || group.label)) || ""
        );
        const wrap = document.createElement("div");
        wrap.className = "logo-group";
        // 관리자가 끌 수 있는 그룹 라벨 글자. 끄더라도 **로고 alt 텍스트는
        // 그대로 둔다** — 화면에서 글자를 빼는 선택이지 스크린 리더 사용자가
        // 그룹을 구분하지 못하게 하려는 것이 아니다.
        // 키가 없는 기존 룸은 true 로 읽혀 종전 화면이 유지된다.
        if (showLogoLabels) {
          const caption = document.createElement("span");
          caption.className = "logo-group-label";
          caption.textContent = label;
          wrap.appendChild(caption);
        }
        assets.forEach(function (name, i) {
          wrap.appendChild(makeLogoImage(name, i === 0 ? label + " 로고" : ""));
        });
        logoBar.appendChild(wrap);
        shown += 1;
      });
      // 전 그룹이 비면 바가 0 높이로 접히고 발표 영역이 그 공간을 갖는다.
      logoBar.hidden = shown === 0;

      // --- 자막 컬럼 부트스트랩 (ISSUE-41) ---------------------------------
      captionLive = $("caption-live");
      captionEnded = $("caption-ended");
      scroller = $("caption-scroll");
      container = $("caption-container");
      announcer = $("caption-announcer");
      connError = $("conn-error");
      applyWaitingText(CONFIG.caption_lang);

      // --- 발표자료 화면 캡처 부트스트랩 (ISSUE-42) -------------------------
      stageRoot = $("stage-root");
      captureVideo = $("capture-video");
      captureControls = $("capture-controls");
      connectButton = $("capture-connect");
      captureHint = $("capture-hint");
      captureWarning = $("capture-warning");
      handoffPrompt = $("handoff-prompt");

      connectButton.textContent = CONNECT_LABEL;
      _showControls(true); // 연결 전에는 버튼과 커서가 모두 살아 있어야 한다

      // 브라우저 정책상 getDisplayMedia 는 사용자 제스처 1회를 요구한다.
      connectButton.addEventListener("click", function () {
        startCapture();
      });

      // --- F10 → 발표자료 연결 해제 (#178) --------------------------------
      //
      // **NFR-025 의 의도된 예외다.** 그 요구사항의 load-bearing 부분은 "무대
      // 창이 발표 중에 OS 포커스를 쥐지 않는다" 와 "프레젠터 리모컨이 보내는
      // 키(화살표/PageUp/PageDown/Space)를 절대 가로채지 않는다" 이고, 그 둘은
      // 여기서도 그대로 지킨다:
      //   - `{ passive: true }` — 브라우저에 "절대 취소하지 않는다" 를 약속한다.
      //     기본 동작 취소를 **호출할 수 없는** 리스너다 (호출하면 브라우저가
      //     무시하고 콘솔 경고를 낸다). 그 API 이름을 여기 적지 않는 것은
      //     `test_no_presenter_keyboard_interference` 가 파일 전체에서 그
      //     문자열을 0건으로 세기 때문이다 — 주석도 함께 집계된다.
      //   - F10 **하나만** 본다. 다른 키는 조건에서 걸러져 아무 일도 하지 않는다.
      //   - 리모컨 키 목록에 F10 은 없다 (리모컨은 PageUp/PageDown/F5/Esc/'.'
      //     계열을 보낸다).
      //
      // 그리고 애초에 **무대 창이 포커스를 쥐고 있어야만** 이 키가 도달한다.
      // 발표 중에는 발표 앱이 포커스를 갖고 있으므로 F10 은 오지 않는다 — 그래서
      // 이 경로는 오퍼레이터 패널 버튼(control 명령)을 **대체하지 않고** 보조한다.
      // 무대 창을 띄운 모니터에서 직접 끊고 싶을 때의 지름길이다.
      //
      // `?debug=1` 카운터와 함께 두 개의 keydown 등록이 존재하게 되며, 둘 다
      // passive 이고 둘 다 취소하지 않는다. `test_no_presenter_keyboard_interference`
      // 가 그 좁은 불변식을 검사한다.
      document.addEventListener("keydown", function (ev) {
        if (ev.key !== "F10") return;
        disconnectPresentation();
      }, { passive: true });

      // 재선택 복귀는 보이는 어포던스 없는 코너 더블클릭으로만 한다. 상시 보이는
      // 컨트롤은 그 자체가 무대 창이 포커스를 되찾는 경로다 (NFR-025).
      $("reselect-zone").addEventListener("dblclick", function () {
        if (!captureStarted) return;
        connectButton.textContent = RECONNECT_LABEL;
        _hideHandoff();
        _showControls(true);
      });

      // blur 는 핸드오프 성공 신호이자 진단 오버레이의 갱신 트리거다. 두 이벤트
      // 모두 키 이벤트가 아니므로 프레젠터 리모컨과 무관하다.
      window.addEventListener("blur", onWindowBlur);
      window.addEventListener("focus", onWindowFocus);
      setupDebugOverlay();

      // 종료된 룸은 종료 상태로 시작하고 EventSource 를 아예 열지 않는다.
      // NFR-025: 이 페이지는 기본 경로에서 document/window 레벨 키 이벤트를
      // 등록하지 않고 포커스/전체화면 API 도 자동 호출하지 않는다 — 전체화면은
      // 조작자가 F11 로 직접 넣는다. 페이지가 스스로 전체화면에 진입하면
      // 포커스가 무대 창으로 되돌아와 행사장에서 슬라이드가 넘어가지 않는다.
      if (CONFIG.initial_state === "closed") {
        setCaptionState("ended");
      } else {
        setCaptionState("waiting");
        connect(CONFIG.caption_lang);
      }
    });
  </script>
</head>
<body>
  <div class="stage" id="stage-root">
    <main class="stage-main">
      <!-- 부제(`#event-subtitle`)는 제거됐다 — 무대 화면에서 쓰지 않기로 했고
           `stage_config` 에서도 `event_subtitle` 키가 사라졌다. -->
      <header class="event-header" id="event-header">
        <h1 class="event-title" id="event-title">{{ROOM_NAME}}</h1>
      </header>

      <section class="presentation" id="presentation" aria-label="발표 화면">
        <div class="stage-frame" id="stage-frame">
          <!-- ISSUE-42 의 캡처 스트림이 여기에 붙는다. object-fit: contain 이라
               16:9 가 아닌 소스도 잘리거나 늘어나지 않고 레터박스로 들어간다. -->
          <video class="capture-video" id="capture-video" autoplay muted playsinline hidden></video>

          <!-- 타이틀 카드(`#title-card`)는 제거됐다.
               FR-075 는 캡처가 끊겼을 때 "검은 화면 대신 타이틀 카드로" 되돌리는
               선택이었지만, 미연결 상태에서는 **연결 버튼만** 보이는 쪽으로
               바꿨다 — 행사 타이틀과 로고는 이미 상단 헤더(#event-header)와 하단
               로고 바(#logo-bar)가 들고 있어 프레임 안에서 중복됐다. 미연결
               화면은 이제 프레임 배경 + 연결 버튼뿐이다. -->

          <!-- 자기 캡처(무한 거울) 경고. 캡처를 끊지 않고 재선택만 안내한다
               (FR-081). 라이브 리전이 아니다 — 무대는 프로젝터 출력이고,
               라이브 리전 소유자는 #caption-announcer 하나뿐이다 (RL-019). -->
          <div class="capture-warning" id="capture-warning" hidden>
            무대 화면이 캡처되었습니다. 발표자료 창을 선택하세요
          </div>

          <!-- 포커스 핸드오프 안내(1회). HANDOFF_MS 후 또는 창이 포커스를 잃는
               즉시 사라진다 — 무대 화면에 영구적으로 남지 않는다. -->
          <div class="handoff-prompt" id="handoff-prompt" hidden>
            발표 앱을 클릭해 포커스를 넘기세요
          </div>

          <!-- 무대 화면의 유일한 클릭 표면. 연결되면 통째로 렌더 트리에서
               빠진다(display: none) — OS 포커스를 부르는 경로를 없애는 것이
               목적이므로 pointer-events 로 죽이는 것만으로는 부족하다. -->
          <div class="capture-controls" id="capture-controls">
            <button class="capture-button" id="capture-connect" type="button">발표자료 연결</button>
            <p class="capture-hint" id="capture-hint" hidden></p>
          </div>

          <!-- 재선택 복귀 지점. 보이는 어포던스도 포커스 가능성도 없는 코너
               더블클릭 제스처다 (NFR-025). -->
          <div class="reselect-zone" id="reselect-zone"></div>
        </div>
      </section>

      <footer class="logo-bar" id="logo-bar" hidden></footer>
    </main>

    <aside class="caption-column" id="caption-column" aria-label="자막">
      <div class="caption-live" id="caption-live">
        <div class="caption-scroll" id="caption-scroll">
          <!-- aria-hidden 은 의도된 것이다. 되돌리지 말 것 (RL-019).
               ISSUE-40(PR #122 UI-6)은 이 노드를 polite 라이브 리전으로 둔 채
               셸을 출하했지만, ISSUE-41 의 타자기가 바로 이 노드에
               .caption-line 을 append 하고 마지막 라인의 textContent 를 매
               requestAnimationFrame 마다 바꾸며 MAX_LINES 로 앞쪽 자식을
               잘라낸다 — 라이브 리전으로 두면 모든 공개 프레임과 모든 트리밍이
               스크린리더로 낭독된다. 라이브 리전 소유자는 아래
               #caption-announcer 이고, 라인이 **확정될 때만** 갱신된다. -->
          <div class="caption-container" id="caption-container" aria-hidden="true">
            <div class="caption-empty" id="caption-empty">잠시 후 시작됩니다</div>
          </div>
        </div>
      </div>
      <p class="sr-only" id="caption-announcer" aria-live="polite" aria-atomic="true"></p>
      <div class="caption-ended" id="caption-ended" role="status" hidden>
        세션이 종료되었습니다
      </div>
      <div class="conn-error" id="conn-error" role="status">
        연결이 끊어졌습니다. 재연결 중…
      </div>
    </aside>
  </div>
</body>
</html>
