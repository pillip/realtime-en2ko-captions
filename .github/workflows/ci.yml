name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-

      - name: Run ruff check
        run: uv run ruff check . --config pyproject.toml

      - name: Run black check
        run: uv run black --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-

      - name: Run tests with coverage
        run: uv run pytest -m 'not e2e' --cov=. --cov-report=term-missing --cov-fail-under=60

  # Security-guard mutation check (ISSUE-43, NFR-028 / RL-004). Runs in
  # parallel with e2e. Deliberately NOT a whole-repo mutation run: the
  # runner walks a fixed catalogue (guard_mutations.toml) restricted to a
  # hardcoded allowlist and executes only the pytest nodes that declare
  # "Guard: <id>" in their docstring. Measured locally at ~10s for 20
  # guards, so the job cost is dominated by checkout + uv sync.
  #
  # The `test` job command above is intentionally untouched — adding a gate
  # must never weaken an existing one.
  mutation:
    name: Guard mutation check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-

      # Non-zero exit means a security guard was deleted without any test
      # noticing, or a guard lost its `Guard:` owner. Both are hard failures.
      - name: Run security guard mutation check
        run: uv run python guard_mutations.py

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-

      # Playwright browsers are ~500MB; cache them to avoid re-download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium + deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      # The e2e fixture (tests/e2e/conftest.py) spawns Streamlit as a
      # subprocess with dummy AWS creds. OpenAI is not exercised — the
      # 22 e2e tests cover UI, room isolation, viewer page, and metrics
      # only. --no-cov because per-file coverage would show 0% for
      # subprocess-run code and trip --cov-fail-under.
      - name: Run E2E suite
        run: uv run pytest tests/e2e -m e2e --no-cov -v
