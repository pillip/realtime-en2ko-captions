repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending

  # Ruff — LINTER ONLY. Do not add ruff's formatter hook here (ISSUE-65):
  # `ruff format` and `black` disagree on the wrapped `assert <cond>, <long msg>`
  # layout and revert each other on every run, so both hooks fail forever and the
  # file becomes uncommittable. black is this repo's only formatter.
  # Rationale and guard: CLAUDE.md "Formatter policy",
  # tests/test_precommit_formatter_policy.py
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        args: [--fix]

  # Black — the single formatter
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.11
