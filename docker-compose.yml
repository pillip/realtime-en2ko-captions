version: '3.8'

services:
  realtime-caption:
    build: .
    container_name: realtime-caption
    restart: unless-stopped
    ports:
      - "8501:8501"
      # 번역 파이프라인 WebSocket — WS_PORT 고정, 브라우저가 직접 접속 (#84)
      - "${WS_PORT:-8765}:${WS_PORT:-8765}"
      # 뷰어 SSE 브로드캐스트 서버 (ISSUE-30) — QR 스캔한 기기가 접속하는 포트
      - "${SSE_PORT:-8766}:${SSE_PORT:-8766}"
    environment:
      - OPENAI_KEY=${OPENAI_KEY}
      - WS_PORT=${WS_PORT:-8765}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - SSE_PORT=${SSE_PORT:-8766}
      # 세션 쿠키 HMAC 서명 키 (ISSUE-55). compose 의 environment 는 **열거한
      # 키만** 컨테이너에 넣으므로, 이 줄이 없으면 .env 에 적어도 앱에 도달하지
      # 않는다 — ISSUE-55 가 이 변수를 운영 필수로 승격했는데 배포 경로가 그걸
      # 전달할 수 없는 상태였다. 미설정이면 컨테이너 기동마다 무작위 생성되어
      # 재시작 시 기존 로그인 세션이 모두 무효가 된다.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # QR 코드에 들어갈 뷰어 base URL — 미설정 시 http://localhost:{SSE_PORT} (로컬 전용)
      - VIEWER_BASE_URL=${VIEWER_BASE_URL:-}
    volumes:
      # 로그 파일을 호스트에 저장
      - ./logs:/app/logs
      # 데이터베이스 파일을 호스트에 저장 (영구 보존)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 프록시 (선택적)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - realtime-caption
    profiles:
      - with-proxy
